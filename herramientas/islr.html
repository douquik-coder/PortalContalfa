<style>

<body>
<header class="top">
  <span class="logo-chip" id="logoChip" style="display:none"><img class="logo" alt="Contalfa"></span>
  <h1>Precierre anual · Proyección y conciliación ISLR</h1>
  <span class="sp"></span>
  <span id="saveState"></span>
  <span class="dir" id="dirName"></span>
  <button onclick="elegirCarpeta()">Carpeta de datos</button>
</header>
<main id="app"></main>
<div id="modal"></div>
<button id="iaBtn" class="noprint" onclick="iaToggle()">✦ Preguntar a la IA</button>
<aside id="iaPanel" class="noprint"></aside>

<script>
/* ================== Utilidades ================== */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const CATS=['Ingresos','Costos','Gastos','Otros ingresos','Otros egresos'];
const CAT_SIGN={'Ingresos':-1,'Otros ingresos':-1,'Costos':1,'Gastos':1,'Otros egresos':1};
const EXP_CATS=['Costos','Gastos','Otros egresos'];
const METODOS={sugerido:'Sugerido (análisis)',ultimo:'Último mes',prom3:'Promedio últimos 3 meses',promedio:'Promedio del período',cero:'Sin proyección (0)'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>(v==null||!isFinite(v))?'':(Math.abs(v)<0.005?'0,00':Number(v).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}));
const pct=(v,d=1)=>isFinite(v)?(v*100).toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d})+'%':'—';
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const avg=a=>a.length?sum(a)/a.length:0;
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function parseNum(s){
  if(typeof s==='number')return s;
  s=String(s??'').trim(); if(!s)return 0;
  let neg=/^\(.*\)$/.test(s); s=s.replace(/[^\d,.\-]/g,'');
  if(s.includes(',')&&s.includes('.')){ s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(s.includes(',')){ s=s.replace(/\./g,'').replace(',','.'); }
  else if((s.match(/\./g)||[]).length>1){ s=s.replace(/\./g,''); }
  else if(/\.\d{3}$/.test(s)&&!/^-?0\./.test(s)){ s=s.replace('.',''); }
  const v=parseFloat(s)||0; return neg?-Math.abs(v):v;
}
const num=c=>(c===''||c==null)?0:(typeof c==='number'?c:parseNum(c));
const normN=s=>String(s??'').trim().toUpperCase().replace(/\s+/g,' ');
const keyOf=(code,name)=>code+'|'+normN(name);
const ek=k=>encodeURIComponent(k).replace(/'/g,'%27');
const dk=k=>decodeURIComponent(k);
const nivelDe=name=>{const i=String(name).indexOf(' - ');return i>=0?String(name).slice(i+3).trim():'';};
const isCode=s=>/^\d[\d.\-]*\d$/.test(String(s).trim())&&/[.\-]/.test(String(s));

/* ================== Almacenamiento en carpeta ================== */
let DIR=null, EMPRESAS=[], DB=null, EJK=null, TAB='datos', saveTimer=null, FILTRO={cat:'',q:'',soloMov:true}, PNDQ='';
const FS_OK=!!window.showDirectoryPicker;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('precierre-islr',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;});}
async function kvGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}

async function elegirCarpeta(){
  if(!FS_OK){alert('Tu navegador no permite guardar en carpetas. Abre este archivo en Google Chrome o Microsoft Edge.');return;}
  try{DIR=await window.showDirectoryPicker({mode:'readwrite'});await kvSet('dir',DIR);await cargarEmpresas();DB=null;render();}catch(e){}
}
async function reconectar(){
  const h=await kvGet('dir'); if(!h)return elegirCarpeta();
  if((await h.requestPermission({mode:'readwrite'}))==='granted'){DIR=h;await cargarEmpresas();render();}
}
async function cargarEmpresas(){
  EMPRESAS=[]; if(!DIR)return;
  for await(const [name,h] of DIR.entries()){
    if(h.kind!=='file'||!/^precierre_.*\.json$/i.test(name))continue;
    try{const t=await (await h.getFile()).text();const o=JSON.parse(t);if(o.app==='precierre-islr')EMPRESAS.push({file:name,nombre:o.empresa.nombre,rif:o.empresa.rif,ejercicios:Object.keys(o.ejercicios||{})});}catch(e){}
  }
  EMPRESAS.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  document.getElementById('dirName').textContent=DIR?('📁 '+DIR.name):'';
}
const fileName=rif=>'precierre_'+String(rif).toUpperCase().replace(/[^A-Z0-9]/g,'')+'.json';
async function abrirEmpresa(file){
  const h=await DIR.getFileHandle(file); DB=JSON.parse(await (await h.getFile()).text());
  Object.values(DB.ejercicios).forEach(ej=>{(ej.bc?.cuentas||[]).forEach(c=>{if(!c.k)c.k=keyOf(c.code,c.name);});migrar(ej);});
  const ks=Object.keys(DB.ejercicios).sort(); EJK=ks[ks.length-1]||null; TAB='datos'; render();
}
function guardar(){
  clearTimeout(saveTimer); setSave('Guardando…','mut');
  saveTimer=setTimeout(async()=>{
    if(!DB)return;
    DB.actualizado=new Date().toISOString();
    if(!DIR){setSave('Sin carpeta: los cambios no se guardan','bad');return;}
    try{const h=await DIR.getFileHandle(fileName(DB.empresa.rif),{create:true});const w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();setSave('✓ Guardado en carpeta','ok');}
    catch(e){setSave('Error al guardar: '+e.message,'bad');}
  },600);
}
function setSave(t,c){const e=document.getElementById('saveState');e.textContent=t;e.style.color=c==='ok'?'#9fe0bd':c==='bad'?'#ffb4ab':'#cfd8e8';}

/* ================== Modelo ================== */
function nuevoEjercicio(anio,mesInicio,hasta){
  const cats={};CATS.forEach(c=>cats[c]={m:'sugerido',p:0});
  return {anio:+anio,mesInicio:+mesInicio,hasta:+hasta,bc:null,mayor:{files:[],cuentas:{}},
    cfg:{cats,comp:true,verMeses:false,banco:null,pasivoDef:null,erDet:false,bcCero:true},ctas:{},pndLin:{},pndMan:[],provs:[],dedAnt:{},dedMan:[],
    islr:{tarifa:'t2',tasa:34,ut:43,
      ret:{ctas:null,ytd:null,m:'ratio',p:5,man:{}},
      ant:{ctas:null,ytd:null,m:'pct',p:1,man:{}},antV:2,
      exc:{ctas:null,monto:null},
      perd:0,noGrav:0,otrasReb:0,ajustes:[],
      locti:{on:false,p:0.5},fdp:{on:false,p:1}}};
}
const E=()=>DB&&EJK?DB.ejercicios[EJK]:null;
const NP=()=>12-E().hasta;
function mesLabel(i,ej=E()){ // i = índice del mes fiscal 0..11
  const m=(ej.mesInicio-1+i)%12; const y = ej.mesInicio===1?ej.anio:(m+1>=ej.mesInicio?ej.anio-1:ej.anio);
  return MES3[m]+'-'+String(y).slice(-2);
}
const mesNombre=(i,ej=E())=>MESES[(ej.mesInicio-1+i)%12];

/* ================== Lectura de Excel ================== */
function leerLibro(file){
  return new Promise((res,rej)=>{
    if(!window.XLSX){rej(new Error('No se pudo cargar el lector de Excel (requiere internet la primera vez).'));return;}
    const r=new FileReader();
    r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array',cellDates:true});let aoa=[];
      wb.SheetNames.forEach(s=>{aoa=aoa.concat(XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true,defval:''}));});res(aoa);}catch(e){rej(e);}};
    r.onerror=()=>rej(r.error); r.readAsArrayBuffer(file);
  });
}
function parseBC(aoa){
  let hi=aoa.findIndex(r=>r.some(c=>/d[eé]b/i.test(String(c)))&&r.some(c=>/cr[eé]d|haber/i.test(String(c))));
  const labels=hi>=0?aoa[hi].filter(c=>String(c).trim()!=='').map(String):['Saldo Inicial','Debe','Haber','Saldo','Saldo Final'];
  const roles=labels.map(l=>/inicial|anterior/i.test(l)?'si':/d[eé]b/i.test(l)?'debe':/cr[eé]d|haber/i.test(l)?'haber':/final|actual/i.test(l)?'sf':'sp');
  const cuentas=[],stack=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]; const c0=String(r[0]??'').trim(); const ne=r.filter(c=>String(c).trim()!=='').length;
    if(isCode(c0)&&typeof r[1]==='string'){
      const o={code:c0,k:keyOf(c0,r[1]),name:r[1].trim(),grupo:stack.slice(),si:0,debe:0,haber:0,sp:null,sf:null};
      roles.forEach((ro,k)=>{o[ro]=num(r[2+k]);});
      if(o.sp==null)o.sp=o.debe-o.haber; if(o.sf==null)o.sf=o.si+o.sp;
      cuentas.push(o);
    } else if(/^total/i.test(c0)){
      const nm=c0.replace(/^total\s*/i,'').trim().toUpperCase();
      const k=stack.map(s=>s.toUpperCase()).lastIndexOf(nm);
      if(k>=0)stack.length=k; else stack.pop();
    } else if(c0&&ne===1){ stack.push(c0); }
  }
  return cuentas;
}
function mesDe(c){
  if(c instanceof Date)return c.getMonth()+1;
  if(typeof c==='number'&&c>59&&window.XLSX){const d=XLSX.SSF.parse_date_code(c);return d?d.m:null;}
  const s=String(c).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-\d{1,2}/)))return +m[2];
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.]\d{2,4})?$/)))return +m[2];
  return null;
}
const RE_CTA=/^(\d[\d.]*\d)\s*[-–]\s*(.+)$/;
const esCabCta=r=>RE_CTA.test(String(r[0]??'').trim())&&r.slice(1).every(x=>typeof x!=='number');
function detectarCols(aoa,hi,cF=0){
  // Busca las columnas Debe, Haber y Saldo acumulado comprobando el saldo corrido línea a línea
  const rows=[];let acct=-1;
  for(let i=hi+1;i<aoa.length&&rows.length<4000;i++){const r=aoa[i];if(esCabCta(r)){acct=i;continue;}if(acct>=0&&mesDe(r[cF]))rows.push({acct,r});}
  if(rows.length<3)return null;
  const width=Math.max(...rows.slice(0,300).map(x=>x.r.length));
  const numCols=[...Array(width).keys()].filter(j=>rows.filter(x=>typeof x.r[j]==='number').length>rows.length*0.6);
  let best=null;
  for(const d of numCols)for(const hc of numCols)for(const s of numCols){
    if(d===hc||d===s||hc===s)continue; let ok=0,tot=0,mov=0;
    for(let k=1;k<rows.length;k++){if(rows[k].acct!==rows[k-1].acct)continue;const a=rows[k-1].r,b=rows[k].r;tot++;
      if(Math.abs(num(a[s])+num(b[d])-num(b[hc])-num(b[s]))<0.02)ok++; if(num(b[d])||num(b[hc]))mov++;}
    const sc=ok+(mov/1e6)+s/1e9; // a igual puntaje, prefiere la columna de saldo más a la derecha (acumulado)
    if(tot&&mov&&(!best||sc>best.sc))best={d,h:hc,s,ok,tot,sc};
  }
  return best&&best.ok>=best.tot*0.85?best:null;
}
function parseMayor(aoa,mesInicio,fid){
  let hi=aoa.findIndex(r=>r.some(c=>/^fecha/i.test(String(c).trim()))&&r.some(c=>/debe|d[eé]bito/i.test(String(c))));
  const H=hi>=0?aoa[hi].map(c=>String(c).trim().toLowerCase()):[];
  const ix=(re,d)=>{const k=H.findIndex(h=>re.test(h));return k>=0?k:d;};
  let cF=ix(/^fecha/,0),cD=ix(/detalle|descrip|concepto/,1),cR=ix(/refer|comprob|asiento|documento/,2);
  // confirmar columnas de texto con los datos (por si el encabezado viene corrido)
  {const muestra=aoa.slice(hi+1,hi+400).filter(r=>!esCabCta(r));const w=Math.max(0,...muestra.map(r=>r.length));
   const cnt=j=>muestra.filter(r=>mesDe(r[j])).length;let bf=cF,bv=cnt(cF);for(let j=0;j<w;j++){const v=cnt(j);if(v>bv){bv=v;bf=j;}}cF=bf;

function checarBC(cs,aoa){

  if(Math.abs(SF)>1&&Math.abs(D-H)<=1&&Math.abs(SI)<=1)out.push({t:'bad',m:`<b>Los saldos finales no suman cero</b> (diferencia ${fmt(SF)}). Revisa que las columnas del reporte sean saldo inicial, débitos, créditos y saldo final.`});
  const inc=cs.filter(c=>Math.abs(c.si+c.debe-c.haber-c.sf)>1);
  if(inc.length)out.push({t:'warn',m:`<b>${inc.length} cuentas no cuadran consigo mismas</b> (saldo inicial + débitos − créditos ≠ saldo final): ${lst(inc)}. Puede ser un reporte con columnas cambiadas o movimientos fuera del rango de fechas.`});

  if(aoa){const tr=aoa.find(r=>r.some(x=>/^totales?$/i.test(String(x).trim())));
    if(tr){const i=tr.findIndex(x=>/^totales?$/i.test(String(x).trim()));const ns=tr.slice(i+1);const td=num(ns[1]),th=num(ns[2]);

  return out;
}

function sugerir(vals,name){
  const n=vals.length,nzv=vals.filter(v=>Math.abs(v)>0.005),nz=nzv.length,last=vals[n-1];
  let r;
  if(!nz)r={base:0,nota:'Sin movimiento',crec:0};
  else if(Math.abs(sum(vals))<0.005)r={base:0,nota:'Movimientos se compensan → 0',crec:0};
  else if(nz/n<0.5&&Math.abs(last)<0.005)r={base:0,nota:`No recurrente (${nz} de ${n} meses) → 0`,crec:0};
  else if(nz/n<0.5&&n>=2&&Math.abs(vals[n-2])>0.005)r={base:(last+vals[n-2])/2,nota:'Gasto nuevo en los últimos meses → promedio últ. 2 meses',crec:0};
  else if(nz/n<0.5)r={base:avg(vals),nota:`Ocasional (${nz} de ${n} meses) → promedio mensual`,crec:0};
  else{
    const l3=vals.slice(-3); let base=l3.length===3?l3[2]*.5+l3[1]*.3+l3[0]*.2:avg(l3); let nota='Recurrente → prom. ponderado últ. 3 meses';
    const med=median(vals.slice(-6));
    if(n>=4&&Math.abs(med)>0&&Math.abs(last)>2.5*Math.abs(med)&&Math.abs(last)>2*Math.abs(vals[n-2])){base=med;nota='Último mes atípico → mediana últ. 6 meses';}
    let crec=0;
    if(n>=6){const a=avg(vals.slice(-3)),b=avg(vals.slice(-6,-3));if(a>0&&b>0&&a>b){crec=Math.min(Math.pow(a/b,1/3)-1,0.10);nota+=` + tendencia ${pct(crec)} mensual`;}}
    if(base*sum(vals)<0){base=0;crec=0;nota='Signo contrario al acumulado (reversos) → 0';}
    r={base,nota,crec};
  }
  if(/UTILIDADES|AGUINALDO|BONIFICACI[OÓ]N|BONO (DE )?FIN|VACACION/i.test(name))r.nota+=' · ⚠ revisar pagos de fin de año';
  return r;
}
function proyectar(vals,metodo,p,comp,np,name){
  let base=0,nota='',crec=0;
  if(metodo==='ultimo'){base=vals[vals.length-1];nota='Último mes';}
  else if(metodo==='prom3'){base=avg(vals.slice(-3));nota='Prom. últimos 3 meses';}
  else if(metodo==='promedio'){base=avg(vals);nota='Promedio '+vals.length+' meses';}
  else if(metodo==='cero'){nota='Sin proyección';}
  else ({base,nota,crec}=sugerir(vals,name));
  if(p)nota+=` ${p>0?'+':''}${p}%${comp?' acumulativo':''}`;
  const out=[];for(let k=0;k<np;k++){out.push(base*Math.pow(1+p/100,comp?k+1:1)*Math.pow(1+crec,k+1));}
  return {out,nota,base};
}

  const ps=pasivosBC().filter(p=>!/ISLR|I\.S\.L\.R|RENTA|\bIVA\b/i.test(p.name)||ES_ISLR.test(name)),niv=limpio(nivelDe(name)),base=limpio(String(name).split(' - ')[0]),todo=limpio(name);

const PROV_TPL={
  locti:{nombre:'Aporte LOCTI (FONACIT)',base:'ingUlt',p:0.5,nd:false,re:/LOCTI|FONACIT/i,nota:'Aporte mensual sobre los ingresos brutos del mes anterior: al cierre queda por pagar el del último mes. El % depende de la actividad; verifícalo.'},

  ona:{nombre:'Aporte Fondo Nacional Antidrogas',base:'util',p:1,nd:false,re:/\bONA\b|\bFONA\b|ANTIDROGA/i,nota:'1% de la ganancia en operaciones; aplica a empresas con 50 o más trabajadores. Verifica si la empresa está obligada.'},
  patente:{nombre:'Impuesto municipal (patente) del último mes',base:'ingUlt',p:1,nd:true,re:/PATENTE|ACTIVIDADES ECON/i,nota:'Alícuota según la ordenanza del municipio y la actividad. Si no se paga antes del cierre no es deducible en este ejercicio.'},
  pensiones:{nombre:'Contribución especial protección de pensiones',base:'fijo',p:0,nd:true,re:/PENSION/i,nota:'Se calcula sobre los pagos al personal: escribe el monto pendiente. No es deducible del ISLR.'},
  otra:{nombre:'Otra provisión',base:'fijo',p:0,nd:false,re:null,nota:'Provisión libre: indica la base y el % o escribe el monto.'}
};
const BASES={ing:'Ingresos del ejercicio',ingUlt:'Ingresos del último mes',ingt:'Ingresos totales (con otros ingresos)',util:'Utilidad contable antes de provisiones',fijo:'Monto fijo'};
function calcProvs(rows,R0,S0,ut){
  const ej=E(),np=NP(),rowBy=new Map(rows.map(r=>[r.key,r])),ps=pasivosBC();
  const ingT=S0['Ingresos'].ytd+sum(S0['Ingresos'].proj),ingU=S0['Ingresos'].proj[np-1]||0,ingt=ingT+S0['Otros ingresos'].ytd+sum(S0['Otros ingresos'].proj);
  return ej.provs.map((p,ix)=>{
    const t=PROV_TPL[p.tipo]||PROV_TPL.otra, cod=String(ix+1).padStart(3,'0');
    const baseV={ing:ingT,ingUlt:ingU,ingt,util:R0.total,fijo:0}[p.base]||0;
    let sug=p.base==='fijo'?0:Math.max(baseV*(+p.p||0)/100,0),nota='';
    if(t.min&&p.base==='util'&&R0.total<=t.min*ut){sug=0;nota=`La utilidad no supera ${t.min.toLocaleString('es-VE')} U.T.: no aplica.`;}
    let gRow=null;
    if(p.gasto==='auto')gRow=t.re?rows.find(r=>EXP_CATS.includes(r.cat)&&!r.synthetic&&t.re.test(r.name)):null;
    else if(p.gasto!=='new')gRow=rowBy.get(p.gasto)||null;
    let ya=0; if(gRow&&p.desc&&p.base!=='fijo'){ya=p.base==='ingUlt'?(gRow.proj[np-1]||0):gRow.total;sug=Math.max(sug-ya,0);}
    const monto=p.monto!=null?+p.monto:sug;
    let pas=null;
    if(p.pasivo==='auto')pas=t.re?ps.find(c=>t.re.test(c.name)):null;
    else if(p.pasivo!=='new')pas=acctByKey(p.pasivo);
    if(!pas)pas=syn('2.PRE.P'+cod,p.nombre+' por pagar');
    const gAcct=gRow?{k:gRow.key,code:gRow.code,name:gRow.name}:syn('6.PRE.P'+cod,'Gasto '+p.nombre);
    return {...p,t,baseV,sug,ya,monto,gRow,gAcct,pas,nota};
  });
}

let IDX=null;
function calc(){
  const ej=E(); migrar(ej); const np=NP(),n=ej.hasta; IDX=indiceMayor();
  const rows=cuentasPyG().map(a=>{
    const cfg=ej.ctas[a.key]||(!a.multi&&ej.ctas[a.code])||{};
    const cat=cfg.cat||autoCat(a.code,a.grupo); const sg=CAT_SIGN[cat]||1;
    const {arr,src}=mesesNat(a.m,a.bc); const vals=arr.map(v=>v*sg);
    const ytd=a.bc?sg*(a.bc.debe-a.bc.haber):sum(vals);
    const cc=ej.cfg.cats[cat]||{m:'sugerido',p:0};
    const pr=proyectar(vals,cc.m,+cc.p||0,ej.cfg.comp,np,a.name);
    const exp=EXP_CATS.includes(cat);
    if(exp&&ES_ISLR.test(a.name)){pr.out=pr.out.map(()=>0);pr.nota='Gasto de ISLR: no se proyecta (escribe el monto si aplica)';}
    const man=cfg.man||{}; const proj=pr.out.map((v,k)=>man[k]!=null?man[k]:v);
    const ndAuto=exp?autoND(a.name):null;
    const nd=cfg.nd!=null?cfg.nd:(ndAuto==='si');
    const pagoDef=exp&&TRIB_GASTO.test(a.name)&&!NO_TRIB_GASTO.test(a.name)&&!ES_ISLR.test(a.name)?'ult':'banco';
    return {...a,cat,sg,vals,src,ytd,proj,nota:pr.nota,man,total:ytd+sum(proj),nd:nd&&exp,ndAuto,ndMan:cfg.nd!=null,
      hasMov:Math.abs(ytd)>0.005||vals.some(v=>Math.abs(v)>0.005),pago:exp?(cfg.pago||pagoDef):'banco',pagoDef,
      ndNoPago:cfg.ndNoPago!=null?cfg.ndNoPago:true,cfgPasivo:cfg.pasivo||null,prov:0};
  });
  const sumar=()=>{
    const S={};CATS.forEach(c=>{S[c]={ytd:0,proj:Array(np).fill(0),meses:Array(n).fill(0)};});
    rows.forEach(r=>{const s=S[r.cat];if(!s)return;s.ytd+=r.ytd;r.proj.forEach((v,k)=>s.proj[k]+=v);r.vals.forEach((v,k)=>s.meses[k]+=v);});
    const res=c=>({ytd:c(x=>x.ytd),proj:Array.from({length:np},(_,k)=>c(x=>x.proj[k]))});
    const R=res(f=>f(S['Ingresos'])-f(S['Costos'])-f(S['Gastos'])+f(S['Otros ingresos'])-f(S['Otros egresos']));
    R.total=R.ytd+sum(R.proj); return {S,R};
  };
  const pre=sumar();
  const provs=calcProvs(rows,pre.R,pre.S,+ej.islr.ut||1);
  provs.forEach(p=>{
    if(!p.monto)return;
    if(p.gRow){p.gRow.proj[np-1]+=p.monto;p.gRow.prov+=p.monto;p.gRow.total+=p.monto;}
    else rows.push({key:p.gAcct.k,code:p.gAcct.code,name:p.gAcct.name,grupo:[],cat:p.cat||'Gastos',sg:1,vals:Array(n).fill(0),src:'prov',ytd:0,
      proj:Array.from({length:np},(_,k)=>k===np-1?p.monto:0),nota:'Provisión de cierre',man:{},total:p.monto,nd:false,ndAuto:null,hasMov:true,synthetic:true,prov:p.monto,pago:'banco',ndNoPago:false});
  });
  const {S,R}=sumar();
  rows.forEach(r=>{
    r.porPagar=r.proj.map((_,k)=>r.pago==='todo'||(r.pago==='ult'&&k===np-1));
    r.montoPP=sum(r.proj.map((v,k)=>r.porPagar[k]?v-(k===np-1?r.prov:0):0));
    r.pasivo=r.pago!=='banco'?(acctByKey(r.cfgPasivo)||pasivoPara(r.name)):null;
  });
  // Partidas no deducibles
  const pndCtas=rows.filter(r=>r.nd), ndKeys=new Set(pndCtas.map(r=>r.key));
  const lineas=lineasRevisar(rows,ndKeys), pndLin=lineas.filter(l=>ej.pndLin[l.key]);
  const noPago=rows.filter(r=>r.pago!=='banco'&&r.ndNoPago&&!r.nd&&Math.abs(r.montoPP)>0.005);
  const provND=provs.filter(p=>p.nd&&p.monto&&!(p.gRow&&p.gRow.nd));
  const PND={ctas:sum(pndCtas.map(r=>r.total)),ctasYtd:sum(pndCtas.map(r=>r.ytd)),lin:sum(pndLin.map(l=>l.monto)),man:sum(ej.pndMan.map(m=>+m.monto||0)),noPago:sum(noPago.map(r=>r.montoPP)),prov:sum(provND.map(p=>p.monto))};
  PND.total=PND.ctas+PND.lin+PND.man+PND.noPago+PND.prov;
  // Deducibles causados en años anteriores
  const ded=dedCandidatos();
  const DED={lista:ded,ant:sum(ded.filter(d=>d.on).map(d=>d.monto)),man:sum(ej.dedMan.map(m=>+m.monto||0))};DED.total=DED.ant+DED.man;
  const ing={meses:S['Ingresos'].meses,proj:S['Ingresos'].proj,ytd:S['Ingresos'].ytd};
  const I=calcISLR(ej,R,PND,DED,ing);
  return {rows,S,R,PND,DED,pndCtas,lineas,pndLin,noPago,provs,provND,I,np,n};
}
function lineasRevisar(rows,ndKeys){
  const ej=E(),out=[];
  rows.forEach(r=>{
    if(!EXP_CATS.includes(r.cat)||ndKeys.has(r.key)||!r.m)return;
    r.m.lines.forEach(l=>{if(l[1]<ej.hasta&&l[5]>0&&LIN_RE.test(l[3]))out.push({key:r.key+'|'+l.slice(1).join('|'),code:r.code,cta:r.name,mes:l[1],fecha:l[2],det:l[3],ref:l[4],monto:l[5]-l[6]});});
  });
  return out;
}
function ctasISLR(){
  const o={ret:[],ant:[],exc:[]};
  activosBC().forEach(c=>{
    const n=c.name.toUpperCase();
    if(!/ISLR|I\.S\.L\.R|RENTA/.test(n)||/\bIVA\b/.test(n))return;
    if(/EXCEDENTE|A FAVOR|ANTERIOR/.test(n))o.exc.push(c.k);
    else if(/ANTICIPO|ESTIMADA|PORCI[OÓ]N/.test(n))o.ant.push(c.k);
    else if(/RETENCI/.test(n))o.ret.push(c.k);
  });
  return o;
}
function serieDebitos(keys){const ej=E(),arr=Array(ej.hasta).fill(0),idx=(IDX||indiceMayor()).idx;keys.forEach(k=>{const m=idx.get(k);if(m)m.lines.forEach(l=>{if(l[1]<ej.hasta)arr[l[1]]+=l[5];});});return arr;}
function calcISLR(ej,R,PND,DED,ing){
  const cfg=ej.islr,auto=ctasISLR(),bcm=bcMap(),np=12-ej.hasta;
  const okK=a=>a&&a.length&&a.every(k=>bcm.has(k))?a:null;
  const retC=okK(cfg.ret.ctas)||auto.ret, antC=okK(cfg.ant.ctas)||auto.ant, excC=okK(cfg.exc.ctas)||auto.exc;
  const ytdDeb=cs=>sum(cs.map(c=>bcm.get(c)?.debe||0));
  function serie(o,cs){
    const ytd=o.ytd!=null?+o.ytd:ytdDeb(cs); const meses=serieDebitos(cs); const ratio=ing.ytd?ytd/ing.ytd:0;
    const last=sum(meses)?meses[meses.length-1]:ytd/ej.hasta;
    const proj=Array.from({length:np},(_,k)=>{
      if(o.man[k]!=null)return +o.man[k];
      const base=ing.proj[k];
      if(o.m==='ratio')return base*ratio; if(o.m==='pct')return base*(+o.p||0)/100; if(o.m==='ultimo')return last; return 0;
    });
    return {ytd,meses,ratio,proj,total:ytd+sum(proj),cs};
  }
  const ret=serie(cfg.ret,retC),ant=serie(cfg.ant,antC);
  const retAcct=bcm.get(retC[0])||SYN_RET, antAcct=bcm.get(antC[0])||SYN_ANT;
  const exc=cfg.exc.monto!=null?+cfg.exc.monto:sum(excC.map(c=>bcm.get(c)?.sf||0));
  const util=R.total;
  const ajustes=sum(cfg.ajustes.map(a=>+a.monto||0));
  const enr=util+PND.total-DED.total-(+cfg.noGrav||0)+ajustes;
  const perdMax=enr>0?enr*0.25:0, perd=Math.min(+cfg.perd||0,perdMax);
  const base=Math.max(enr-perd,0);
  const ut=+cfg.ut||1, bu=base/ut; let tasa,sus=0,desc;
  if(cfg.tarifa==='t2'){if(bu<=2000){tasa=.15;sus=0;}else if(bu<=3000){tasa=.22;sus=140;}else{tasa=.34;sus=500;}desc=`Tarifa N° 2 · ${fmt(bu)} U.T. → ${tasa*100}% − sustraendo ${sus} U.T.`;}
  else{tasa=(cfg.tarifa==='fija'?+cfg.tasa:+cfg.tarifa)/100;desc=`Tasa proporcional ${pct(tasa,0)}`;}
  const imp=base>0?Math.max(base*tasa-sus*ut,0):0;
  const rebajas=ret.total+ant.total+exc+(+cfg.otrasReb||0);
  const pagar=imp-rebajas;
  return {ret,ant,retAcct,antAcct,exc,excC,util,ajustes,enr,perd,perdMax,base,ut,bu,tasa,sus,desc,imp,rebajas,pagar,tasaEf:util?imp/util:0};
}

/* ---------- Asientos proyectados y balance de comprobación ajustado ---------- */
function bcAjustado(C){
  const ej=E(),np=C.np,acc=new Map(),asi=[];
  const cta=a=>{if(!acc.has(a.k))acc.set(a.k,{k:a.k,code:a.code,name:a.name,si:0,debe:0,haber:0,pd:0,ph:0,nuevo:!!a.syn});return acc.get(a.k);};
  bcList().forEach(c=>{const o=cta(c);o.si+=c.si;o.debe+=c.debe;o.haber+=c.haber;o.nuevo=false;});
  const post=(k,concepto,deb,cre,m)=>{if(!isFinite(m)||Math.abs(m)<0.005)return;if(m<0){[deb,cre]=[cre,deb];m=-m;}cta(deb).pd+=m;cta(cre).ph+=m;asi.push({k,concepto,deb,cre,m});};
  const bank=cuentaBanco();
  C.rows.forEach(r=>{
    const a={k:r.key,code:r.code,name:r.name,syn:r.synthetic};
    r.proj.forEach((v,k)=>{
      const m=v-(k===np-1?r.prov:0); if(Math.abs(m)<0.005)return;
      if(CAT_SIGN[r.cat]<0)post(k,'Ingreso proyectado cobrado en banco',bank,a,m);
      else if(r.porPagar[k])post(k,'Gasto causado no pagado (queda en pasivo)',a,r.pasivo,m);
      else post(k,'Gasto proyectado pagado por banco',a,bank,m);
    });
  });
  C.provs.forEach(p=>{if(p.monto)post(np-1,'Provisión de cierre: '+p.nombre,p.gAcct,p.pas,p.monto);});
  C.I.ret.proj.forEach((v,k)=>post(k,'Retención de ISLR proyectada',C.I.retAcct,bank,v));
  C.I.ant.proj.forEach((v,k)=>post(k,'Anticipo de ISLR proyectado (pagado por banco)',C.I.antAcct,bank,v));
  const rows=[...acc.values()].map(o=>({...o,sc:o.si+o.debe-o.haber,sf:o.si+o.debe-o.haber+o.pd-o.ph}))
    .sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})||a.name.localeCompare(b.name));
  const T={si:sum(rows.map(r=>r.si)),debe:sum(rows.map(r=>r.debe)),haber:sum(rows.map(r=>r.haber)),pd:sum(rows.map(r=>r.pd)),ph:sum(rows.map(r=>r.ph)),sf:sum(rows.map(r=>r.sf))};
  const checks=[];
  if(Math.abs(T.debe-T.haber)>1)checks.push({t:'bad',m:`El balance cargado ya venía descuadrado en ${fmt(T.debe-T.haber)}; el ajuste mantiene esa diferencia.`});
  if(Math.abs(T.pd-T.ph)>0.01)checks.push({t:'bad',m:`Los asientos proyectados no cuadran (${fmt(T.pd-T.ph)}).`});
  else checks.push({t:'ok',m:`Los asientos proyectados cuadran: débitos = créditos = ${fmt(T.pd)}.`});
  const b=rows.find(r=>r.k===bank.k);
  if(b&&b.sf<-0.005)checks.push({t:'warn',m:`El banco ${esc(b.code+' '+b.name)} queda sobregirado en ${fmt(-b.sf)}: lo proyectado que se paga es mayor que lo que se cobra. Revisa la proyección o elige otra cuenta de banco.`});
  if(rows.some(r=>r.nuevo&&Math.abs(r.sf)>0.005))checks.push({t:'info',m:'Las cuentas marcadas como “nueva” no existen en el balance cargado: créalas en el sistema o reasígnalas a una cuenta existente en la Proyección.'});
  return {rows,asi,T,checks,bank};
}

function difMayorBC(){
  const ej=E(),conMov=bcList().filter(c=>Math.abs(c.debe)+Math.abs(c.haber)>0.005),sinMayor=[],dif=[];let fuera=0;
  if(!ej.mayor.files.length)return {sinMayor,dif,fuera,conMov};
  const idx=indiceMayor().idx;
  bcList().forEach(c=>{const m=idx.get(c.k);const mov=Math.abs(c.debe)+Math.abs(c.haber)>0.005;
    if(!m){if(mov)sinMayor.push(c);return;}
    let de=0,ha=0;m.lines.forEach(l=>{if(l[1]<ej.hasta){de+=l[5];ha+=l[6];}else fuera++;});
    const sm=saldosMayor(m);
    const d={c,de,ha,sf:sm?sm.sf:null,si:sm?sm.si:null};
    if(Math.abs(de-c.debe)>1||Math.abs(ha-c.haber)>1||(sm&&Math.abs(sm.sf-c.sf)>1))dif.push(d);});
  return {sinMayor,dif,fuera,conMov};
}
function cuadre(){
  const ej=E(),bc=ej.bc.cuentas; const dSum=sum(bc.map(c=>c.debe)),hSum=sum(bc.map(c=>c.haber));
  const {sinMayor,dif,fuera,conMov}=difMayorBC();
  const pyg=bc.filter(c=>+c.code[0]>=4);
  let h=`<div class="card"><h2>Validación de la carga</h2><div class="kpis">
   <div class="kpi"><div class="l">Débitos del período</div><div class="v">${fmt(dSum)}</div></div>
   <div class="kpi"><div class="l">Créditos del período</div><div class="v">${fmt(hSum)}</div></div>
   <div class="kpi"><div class="l">Cuentas de resultado</div><div class="v">${pyg.length}</div></div>
   <div class="kpi"><div class="l">Cuentas con movimiento</div><div class="v">${conMov.length}</div></div></div>`;
  const chk=ej.bc.checks||checarBC(bc,null);
  h+=chk.length?alertas(chk):`<div class="alert ok">El balance cuadra: débitos = créditos, los saldos iniciales y finales suman cero y cada cuenta cuadra consigo misma.</div>`;
  if(ej.mayor.files.length){
    h+=alertas(ej.mayor.checks);
    h+=!sinMayor.length&&!dif.length?`<div class="alert ok">El mayor analítico cuadra con el balance en todas las cuentas con movimiento.</div>`:'';
    if(fuera)h+=`<div class="alert warn">${fuera} líneas del mayor caen fuera del período cargado y no se toman en cuenta. Revisa el mes "hasta", el inicio del ejercicio, o si el mayor se exportó con un rango de fechas mayor que el balance.</div>`;
    if(sinMayor.length)h+=`<div class="alert warn"><b>${sinMayor.length} cuentas sin mayor</b> (se proyectan con el promedio del balance): ${sinMayor.slice(0,12).map(c=>esc(c.code+' '+c.name)).join(' · ')}${sinMayor.length>12?' …':''}. Puede faltar un archivo del mayor o la cuenta tiene otro nivel en el mayor.</div>`;
    if(dif.length)h+=`<div class="alert bad"><b>${dif.length} cuentas no cuadran entre el mayor y el balance.</b> Posibles causas: asientos registrados o modificados después de exportar uno de los reportes, rangos de fechas distintos, un archivo del mayor incompleto o niveles agrupados de forma distinta. Vuelve a exportar ambos reportes el mismo día y con el mismo período.</div>
     <div class="scroll" style="max-height:320px"><table><tr><th>Cuenta</th><th>Nombre</th><th class="n">Débitos balance</th><th class="n">Débitos mayor</th><th class="n">Créditos balance</th><th class="n">Créditos mayor</th><th class="n">Saldo acumulado balance</th><th class="n">Saldo acumulado mayor</th></tr>${dif.map(d=>{const bad=(a,b)=>Math.abs(a-b)>1?' style="color:var(--bad);font-weight:600"':'';return `<tr><td class="nw">${d.c.code}</td><td class="nw">${esc(d.c.name)}</td><td class="n">${fmt(d.c.debe)}</td><td class="n"${bad(d.de,d.c.debe)}>${fmt(d.de)}</td><td class="n">${fmt(d.c.haber)}</td><td class="n"${bad(d.ha,d.c.haber)}>${fmt(d.ha)}</td><td class="n">${fmt(d.c.sf)}</td><td class="n"${d.sf!=null?bad(d.sf,d.c.sf):''}>${d.sf!=null?fmt(d.sf):'—'}</td></tr>`;}).join('')}</table></div>`;
  }
  return h+'</div>';
}

function pasivosFiscales(C,B){
  const ej=E(),porPas={};
  C.rows.filter(r=>r.pago!=='banco'&&Math.abs(r.montoPP)>0.005).forEach(r=>{(porPas[r.pasivo.k]=porPas[r.pasivo.k]||[]).push(`${r.name}: ${fmt(r.montoPP)}${r.ndNoPago&&!r.nd?` (no deducible en ${ej.anio}; deducible al pagarse)`:''}`);});
  C.provs.filter(p=>p.monto).forEach(p=>{(porPas[p.pas.k]=porPas[p.pas.k]||[]).push(`Provisión ${p.nombre}: ${fmt(p.monto)}${p.nd?' (no deducible)':''}`);});
  return B.rows.filter(r=>r.code[0]==='2'&&(TRIB.test(r.name)||/PRE\./.test(r.code)||porPas[r.k])&&(Math.abs(r.sf)>0.005||Math.abs(r.ph-r.pd)>0.005)).map(r=>({...r,obs:porPas[r.k]||[]}));
}

const GEM='https://generativelanguage.googleapis.com/v1beta/';
let IA={open:false,msgs:[],busy:false,key:null,model:null,modelos:[],anon:true,cfg:false,err:''};
async function iaInit(){try{IA.key=await kvGet('gemKey')||null;IA.model=await kvGet('gemModel')||null;const a=await kvGet('gemAnon');IA.anon=a==null?true:!!a;}catch(e){}}
function iaToggle(){IA.open=!IA.open;renderIA();if(IA.open)setTimeout(()=>document.getElementById('iaTxt')?.focus(),50);}
async function iaErr(r){let t='';try{const j=await r.json();t=j.error?.message||'';}catch(e){}
  if(r.status===429)return 'Se alcanzó el límite gratuito de Gemini (por minuto o por día). Espera un momento y vuelve a intentar, o elige otro modelo en ⚙.';
  if(r.status===400&&/API key/i.test(t))return 'La clave de API no es válida. Revísala en ⚙.';
  if(r.status===403)return 'La clave no tiene permiso para este modelo o la API no está activa en tu proyecto. '+t;
  if(r.status===404)return 'El modelo ya no está disponible. Elige otro en ⚙. '+t;
  return 'Error '+r.status+': '+t;}
const verGem=n=>{const m=String(n).match(/gemini-(\d+(?:\.\d+)?)/i);return m?parseFloat(m[1]):0;};
async function iaModelos(key){
  const r=await fetch(GEM+'models?pageSize=200',{headers:{'x-goog-api-key':key}}); if(!r.ok)throw new Error(await iaErr(r));
  const j=await r.json();
  return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/gemini/i.test(m.name)&&!/image|tts|audio|live|embed|vision|robotics|computer|learnlm/i.test(m.name))
    .map(m=>({id:m.name,label:(m.displayName||m.name.replace('models/',''))}))
    .sort((a,b)=>{const pa=/preview|exp/i.test(a.id),pb=/preview|exp/i.test(b.id),fa=/flash/i.test(a.id)&&!/lite/i.test(a.id),fb=/flash/i.test(b.id)&&!/lite/i.test(b.id);
      return (fb-fa)||(pa-pb)||(verGem(b.id)-verGem(a.id))||a.id.localeCompare(b.id);});
}
async function iaConectar(){
  const k=document.getElementById('iaKey').value.trim(); if(!k){IA.err='Pega tu clave de API.';return renderIA();}
  IA.err='Verificando la clave…';renderIA();
  try{const ms=await iaModelos(k);if(!ms.length)throw new Error('La clave funciona, pero no hay modelos de texto disponibles.');
    IA.key=k;IA.modelos=ms;if(!IA.model||!ms.some(m=>m.id===IA.model))IA.model=ms[0].id;
    await kvSet('gemKey',k);await kvSet('gemModel',IA.model);IA.err='';IA.cfg=false;}
  catch(e){IA.err=e.message;}
  renderIA();
}
async function iaCfg(){IA.cfg=!IA.cfg;IA.err='';if(IA.cfg&&IA.key&&!IA.modelos.length){try{IA.modelos=await iaModelos(IA.key);}catch(e){IA.err=e.message;}}renderIA();}
async function iaSetModel(v){IA.model=v;await kvSet('gemModel',v);renderIA();}
async function iaSetAnon(v){IA.anon=v;await kvSet('gemAnon',v);renderIA();}
async function iaOlvidar(){if(!confirm('¿Quitar la clave de Gemini de este equipo?'))return;IA.key=null;IA.model=null;IA.modelos=[];await kvSet('gemKey',null);IA.cfg=false;renderIA();}

  if(!ej||!ej.bc)return 'Hay una empresa abierta pero aún no se cargó el balance de comprobación.';
  const C=calc(),B=bcAjustado(C),I=C.I,np=C.np,S=C.S,P=C.PND,D=C.DED;
  const nom=IA.anon?'LA EMPRESA (nombre y RIF ocultos)':`${DB.empresa.nombre} (RIF ${DB.empresa.rif})`;
  const pm=Array.from({length:np},(_,k)=>mesLabel(ej.hasta+k));
  const L=[];
  L.push(`EMPRESA: ${nom}`,`EJERCICIO: ${periodoTxt()}. Cifras en bolívares. Pestaña abierta: ${TAB}.`);
  L.push(`CRITERIO DE PROYECCIÓN: `+CATS.map(c=>`${c}: ${METODOS[ej.cfg.cats[c].m]}${+ej.cfg.cats[c].p?` ${ej.cfg.cats[c].p}%${ej.cfg.comp?' acumulativo':''}`:''}`).join('; '));
  L.push('','ESTADO DE RESULTADOS (real acumulado | '+pm.join(' | ')+' | total ejercicio):');
  const lr=(n,o,s=1)=>`${n}: ${fmt(s*o.ytd)} | ${o.proj.map(v=>fmt(s*v)).join(' | ')} | ${fmt(s*(o.ytd+sum(o.proj)))}`;
  CATS.forEach(c=>L.push(lr(c,S[c])));L.push(lr('RESULTADO ANTES DE ISLR',C.R));
  L.push('','CUENTAS DE RESULTADO (código; nombre; categoría; no deducible; pago; meses reales '+Array.from({length:ej.hasta},(_,i)=>mesLabel(i)).join(',')+'; proyección '+pm.join(',')+'; total; criterio):');
  C.rows.filter(r=>r.hasMov||sum(r.proj)).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total)).forEach((r,i)=>{
    L.push(`${r.code}; ${r.name}; ${r.cat}; ${r.nd?'ND':''}; ${r.pago}; ${i<60?r.vals.map(v=>Math.round(v)).join(','):'acum '+Math.round(r.ytd)}; ${r.proj.map(v=>Math.round(v)).join(',')}; ${Math.round(r.total)}; ${r.nota}${r.prov?'; incluye provisión '+Math.round(r.prov):''}`);});
  L.push('',`ANTICIPOS ISLR (${fmt(+ej.islr.ant.p)}% de ingresos del mes): real ${fmt(I.ant.ytd)}, proyectado ${I.ant.proj.map(fmt).join(' / ')}, total ${fmt(I.ant.total)}`);
  L.push(`RETENCIONES ISLR (${ej.islr.ret.m}, ratio real ${pct(I.ret.ratio,2)}): real ${fmt(I.ret.ytd)}, proyectado ${I.ret.proj.map(fmt).join(' / ')}, total ${fmt(I.ret.total)}`);
  if(C.provs.length)L.push('PROVISIONES DE CIERRE: '+C.provs.map(p=>`${p.nombre}: ${fmt(p.monto)} (base ${BASES[p.base]} ${fmt(p.baseV)} × ${p.p}%, ya registrado ${fmt(p.ya)}, ${p.nd?'no deducible':'deducible'}, pasivo ${p.pas.name})`).join('; '));
  L.push('',`PARTIDAS NO DEDUCIBLES total ${fmt(P.total)}: cuentas ${fmt(P.ctas)} [${C.pndCtas.map(r=>r.name+' '+fmt(r.total)).join('; ')}]; tributos causados no pagados ${fmt(P.noPago)} [${C.noPago.map(r=>r.name+' '+fmt(r.montoPP)).join('; ')}]; provisiones ND ${fmt(P.prov)}; movimientos del mayor ${fmt(P.lin)}; manuales ${fmt(P.man)} [${ej.pndMan.map(m=>m.desc+' '+fmt(m.monto)).join('; ')}]`);
  const rev=C.rows.filter(r=>EXP_CATS.includes(r.cat)&&!r.nd&&r.ndAuto);
  if(rev.length)L.push('Cuentas sugeridas como posible no deducible pero NO marcadas: '+rev.map(r=>r.name+' '+fmt(r.total)).join('; '));
  if(C.lineas.length)L.push('Movimientos del mayor con palabras clave (multas, IGTF, donaciones...) sin marcar: '+C.lineas.filter(l=>!ej.pndLin[l.key]).slice(0,25).map(l=>`${l.fecha} ${l.det} ${fmt(l.monto)}`).join('; '));
  L.push(`DEDUCIBLES DE AÑOS ANTERIORES total ${fmt(D.total)}: `+D.lista.map(d=>`${d.c.name} ${fmt(d.monto)} ${d.on?'(incluido)':'(no incluido)'}`).join('; '));
  L.push('',`CONCILIACIÓN: resultado ${fmt(I.util)} + no deducibles ${fmt(P.total)} − deducibles años anteriores ${fmt(D.total)} − no gravables ${fmt(+ej.islr.noGrav||0)} ± ajustes ${fmt(I.ajustes)} = enriquecimiento neto ${fmt(I.enr)}; pérdidas trasladadas ${fmt(I.perd)}; enriquecimiento gravable ${fmt(I.base)} (${fmt(I.bu)} U.T., U.T. Bs. ${fmt(I.ut)}).`);
  L.push(`ISLR: ${I.desc}; impuesto causado ${fmt(I.imp)}; rebajas: retenciones ${fmt(I.ret.total)}, anticipos ${fmt(I.ant.total)}, excedentes años anteriores ${fmt(I.exc)}, otras ${fmt(+ej.islr.otrasReb||0)}; ${I.pagar>=0?'a pagar':'excedente a favor'} ${fmt(Math.abs(I.pagar))}; tasa efectiva ${pct(I.tasaEf)}.`);
  const bank=B.rows.find(r=>r.k===B.bank.k);
  L.push('',`BALANCE AJUSTADO: banco de contrapartida ${B.bank.name} saldo final ${bank?fmt(bank.sf):'—'}; asientos proyectados ${fmt(B.T.pd)}; cuentas nuevas: ${B.rows.filter(r=>r.nuevo&&Math.abs(r.sf)>0.005).map(r=>r.code+' '+r.name).join(', ')||'ninguna'}.`);
  L.push('Saldos finales ajustados de balance (activo, pasivo, patrimonio) con saldo: '+B.rows.filter(r=>+r.code[0]<=3&&Math.abs(r.sf)>0.5).map(r=>`${r.code} ${r.name} ${fmt(r.sf)}`).join('; '));
  const al=[...(ej.bc.checks||[]),...(ej.mayor.checks||[]),...B.checks.filter(c=>c.t!=='ok')].map(a=>a.m.replace(/<[^>]+>/g,''));
  const dm=difMayorBC(); if(dm.dif.length)al.push(`${dm.dif.length} cuentas no cuadran entre mayor y balance: `+dm.dif.slice(0,10).map(d=>d.c.code+' '+d.c.name).join('; '));
  if(dm.sinMayor.length)al.push(`${dm.sinMayor.length} cuentas sin mayor`);
  L.push('',`ALERTAS: ${al.join(' | ')||'ninguna'}`);
  return L.join('\n');
}
const IA_SYS=`Eres el asistente de una herramienta de precierre anual usada por contadores públicos de una firma en Venezuela. Respondes en español, de forma clara y breve, como un contador senior que revisa el trabajo de su equipo.
Reglas:
- Usa solo los datos del precierre que se te dan abajo y tu conocimiento de contabilidad (VEN-NIF) y de la Ley de ISLR venezolana. No inventes cifras: si un dato no está, dilo y explica dónde verlo en la herramienta.
- Cuando cites montos, usa el formato venezolano (1.234.567,89) y di de qué cuenta o línea salen.
- Si das una opinión fiscal, aclara cuando dependa de documentación o de criterio profesional, y recomienda verificar la norma vigente.
- La herramienta tiene pestañas: 1 Datos y carga, 2 Proyección, 3 Partidas fiscales, 4 Estados proyectados, 5 ISLR, 6 Resumen. Indica en qué pestaña se cambia lo que sugieras.
- No uses tablas en formato markdown; usa párrafos cortos y listas con guiones.

DATOS DEL PRECIERRE ACTUAL:
`;
async function iaEnviar(txt){
  txt=(txt??document.getElementById('iaTxt')?.value??'').trim(); if(!txt||IA.busy)return;
  if(!IA.key){IA.err='Primero conecta tu clave de Gemini.';return renderIA();}
  IA.msgs.push({r:'u',t:txt});IA.busy=true;IA.err='';renderIA();
  try{
    const body={systemInstruction:{parts:[{text:IA_SYS+iaContexto()}]},contents:IA.msgs.map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]})),generationConfig:{temperature:0.3,maxOutputTokens:8192}};
    const r=await fetch(GEM+IA.model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':IA.key},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(await iaErr(r));
    const j=await r.json();const c=j.candidates?.[0];
    const t=(c?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
    if(!t)throw new Error(c?.finishReason==='SAFETY'?'Gemini bloqueó la respuesta por sus filtros de seguridad.':'Gemini no devolvió respuesta ('+(c?.finishReason||j.promptFeedback?.blockReason||'sin detalle')+').');
    IA.msgs.push({r:'m',t});
  }catch(e){IA.msgs.pop();IA.err=e.message;if(document.getElementById('iaTxt'))setTimeout(()=>{const x=document.getElementById('iaTxt');if(x)x.value=txt;},0);}
  IA.busy=false;renderIA();
}
function md(t){
  let s=esc(t);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>')
     .replace(/^\s*[-*•]\s+(.+)$/gm,'<div class="li">• $1</div>').replace(/^\s*(\d+)[.)]\s+(.+)$/gm,'<div class="li">$1. $2</div>').replace(/\n/g,'<br>');
  return s.replace(/<\/div><br>/g,'</div>');
}
const IA_SUG=['¿Qué debo revisar antes de cerrar este precierre?','¿La proyección de ingresos y gastos es razonable?','¿Se me escapa alguna partida no deducible?','Explícame cómo se llegó al ISLR a pagar','¿Por qué el banco queda con ese saldo en el balance ajustado?'];

  const aviso=`<div class="alert warn small">Con el plan <b>gratuito</b>, Google puede usar lo que envíes para mejorar sus productos y personas pueden revisarlo. Se envían las cifras del precierre abierto. Para datos confidenciales de clientes considera activar facturación en tu proyecto de Google (plan de pago) o mantener activa la opción de ocultar nombre y RIF.</div>`;
  if(!IA.key||IA.cfg){
    el.innerHTML=head+`<div class="ia-b">
      ${!IA.key?`<p>Para usar el asistente necesitas una clave gratuita de Gemini:</p><div class="li">1. Entra a <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu cuenta de Google.</div><div class="li">2. Pulsa “Create API key” y cópiala.</div><div class="li">3. Pégala aquí. Se guarda solo en este equipo y navegador, no en la carpeta compartida.</div>`:''}
      <label class="f" style="margin-top:10px">Clave de API de Gemini<input id="iaKey" type="password" value="${esc(IA.key||'')}" placeholder="AIza…"></label>
      <div class="row" style="margin-top:8px"><button class="p" onclick="iaConectar()">${IA.key?'Guardar clave':'Conectar'}</button>${IA.key?'<button onclick="iaOlvidar()">Quitar clave</button>':''}</div>
      ${IA.key&&IA.modelos.length?`<label class="f" style="margin-top:12px">Modelo<select onchange="iaSetModel(this.value)">${IA.modelos.map(m=>`<option value="${esc(m.id)}" ${m.id===IA.model?'selected':''}>${esc(m.label)}</option>`).join('')}</select></label><p class="note">Los modelos “Flash” y “Flash-Lite” son los que suelen estar en el plan gratuito. Si uno da error de límite, prueba otro.</p>`:''}
      <label style="display:block;margin-top:10px"><input type="checkbox" ${IA.anon?'checked':''} onchange="iaSetAnon(this.checked)"> Ocultar nombre y RIF de la empresa al enviar</label>
      ${aviso}
      ${IA.err?`<div class="alert ${/Verificando/.test(IA.err)?'info':'bad'} small">${esc(IA.err)}</div>`:''}
      ${IA.key?'<button class="lnk" onclick="iaCfg()">← Volver al chat</button>':''}</div>`;
    return;
  }
  const hayData=DB&&E()&&E().bc;
  el.innerHTML=head+`<div class="ia-b" id="iaMsgs">
    ${!IA.msgs.length?`<p class="small mut">Pregunta sobre el precierre abierto${hayData?` (<b>${IA.anon?'empresa oculta':esc(DB.empresa.nombre)}</b>, ejercicio ${E().anio})`:''}. El asistente ve el estado de resultados, las cuentas, las partidas fiscales, el ISLR, el balance ajustado y las alertas.</p>
      ${hayData?IA_SUG.map(s=>`<button class="ia-sug" onclick="iaEnviar(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join(''):'<div class="alert info small">Abre una empresa y carga su balance para que el asistente tenga datos.</div>'}`:''}
    ${IA.msgs.map(m=>`<div class="ia-m ${m.r}">${m.r==='u'?esc(m.t).replace(/\n/g,'<br>'):md(m.t)}</div>`).join('')}
    ${IA.busy?'<div class="ia-m m mut">Pensando…</div>':''}
    ${IA.err?`<div class="alert bad small">${esc(IA.err)}</div>`:''}
  </div>
  <div class="ia-f"><textarea id="iaTxt" rows="2" placeholder="Escribe tu pregunta… (Enter envía, Shift+Enter nueva línea)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();iaEnviar();}" ${IA.busy?'disabled':''}></textarea><button class="p" onclick="iaEnviar()" ${IA.busy?'disabled':''}>Enviar</button></div>
  <div class="small mut" style="padding:0 12px 8px">Respuestas generadas por IA: verifícalas antes de usarlas.${IA.anon?' Nombre y RIF ocultos.':''}</div>`;
  const box=document.getElementById('iaMsgs');box.scrollTop=box.scrollHeight;
}

const LOGOS=['logo_contalfa.png','logo_contalfa.jpg','logo_contalfa.jpeg','logo_contalfa.svg','logo_contalfa.webp','contalfa.png','Contalfa.png','logo.png'];
let LOGO_SRC=null;
function buscarLogo(i=0){
  if(i>=LOGOS.length)return;
  const im=new Image();
  im.onload=()=>{LOGO_SRC=LOGOS[i];const t=document.querySelector('#logoChip img');t.src=LOGO_SRC;document.getElementById('logoChip').style.display='flex';if(DB&&['res','est'].includes(TAB))render();};
  im.onerror=()=>buscarLogo(i+1);
  im.src=LOGOS[i];
}
buscarLogo();
