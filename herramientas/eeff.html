function generarCertificacion(e,C){
  const f=firmante(C.firmante);const total=totBienes(C.items);const constit=C.finalidad==='constitucion';
  const aport=[...new Set(C.items.map(b=>b.aportante).filter(Boolean))];
  const D=datosBase(e,{FECHA_INVENTARIO:fLarga(C.fechaInv),FECHA_ASAMBLEA:fLarga(C.fechaAsamblea),FECHA_CIERRE:fLarga(C.fechaInv),APORTANTES:aport.join(', '),FECHA_DESPUES:fLarga(C.fechaInv)});
  if(C.registro)D.REGISTRO=C.registro.replace(/^registro mercantil\s*/i,'');
  const pages=[];const fechaTxt=`Al ${fLarga(C.fechaInv)}`;
  pages.push(pagina(textoAParrafos(plantilla(C.plantilla).texto,D,{informe:true,dirigido:C.dirigido})+firmaContador(f,C.ciudad,C.fechaInf,DB.settings.mostrarFirmaRazon),false,{inf:1,pie:0}));
  // estado de situación del aporte
  const porCat={};C.items.forEach(b=>{porCat[b.categoria]=(porCat[b.categoria]||0)+(+b.cantidad||1)*(+b.valor||0);});
  const inv=porCat['Inventario de mercancías']||0;
  const filas=[{tipo:'h',t:'ACTIVO'}];
  if(inv)filas.push({tipo:'h2',t:'Activo corriente'},{tipo:'l',t:'Inventario de mercancías',nota:'',c:inv},{tipo:'st',t:'Total activo corriente',c:inv});
  const nc=CATS.filter(c=>c!=='Inventario de mercancías'&&porCat[c]);
  if(nc.length){filas.push({tipo:'h2',t:'Activo no corriente – Propiedades, planta y equipos'});nc.forEach(c=>filas.push({tipo:'l',t:c,c:porCat[c]}));filas.push({tipo:'st',t:'Total activo no corriente',c:r2(total-inv)});}
  filas.push({tipo:'gt',t:'TOTAL ACTIVO',c:total},{tipo:'h',t:'PATRIMONIO'},{tipo:'l',t:constit?'Capital social suscrito y pagado en bienes':'Aporte de bienes para aumento de capital social',c:total},{tipo:'gt',t:'TOTAL PATRIMONIO',c:total});
  const ntDet=C.notas==='A'?1:(C.notas==='B'?4:4);
  filas.forEach(x=>{if(x.tipo==='l')x.nota=String(ntDet);});
  pages.push(pagina(encabezado(e,constit?'Estado de situación financiera de apertura (aporte en bienes)':'Estado de aporte de bienes para aumento de capital',fechaTxt)+tablaEF(filas,[fCorta(C.fechaInv)],true)+PIE_NOTAS+firmasPie(e,f)));
  // notas
  const bl=[];let n=1;
  if(C.notas!=='A'){
    bl.push({n:n++,t:'Bases para la compilación',html:constit?`<p>El inventario de bienes muebles e inmuebles se ha preparado y se presenta sobre la base prescrita por la Resolución 019 del Servicio Autónomo de Registros y Notarías (SAREN), con el fin de que la empresa en formación ${esc(e.razon)} cumpla con los requerimientos para su constitución. Los bienes se presentan a los valores acordados y aprobados por los accionistas en el acta constitutiva de fecha ${fLarga(C.fechaAsamblea)}.</p>`:`<p>El inventario de bienes se ha preparado con el fin de presentar ante el Registro Mercantil el aporte de bienes realizado por los accionistas para el aumento del capital social de ${esc(e.razon)}, según asamblea de fecha ${fLarga(C.fechaAsamblea)}. Los bienes se presentan a los valores aprobados por los accionistas.</p>`});
    bl.push({n:n++,t:constit?'Constitución de la empresa, accionistas y dirección':'Entidad que informa',html:notaEntidad(e,C.notas==='C')});
    bl.push({n:n++,t:'Políticas contables de valoración',html:`<p>Los bienes aportados se reconocen inicialmente al valor acordado por los accionistas, el cual se considera su costo atribuido de conformidad con la Sección 17 de la NIIF para las PYMES (VEN-NIF PYME). Con posterioridad, las propiedades, planta y equipos se medirán al costo menos la depreciación acumulada y las pérdidas por deterioro, depreciándose por el método de línea recta durante su vida útil estimada; los terrenos no se deprecian. Los inventarios se medirán al menor entre el costo y el precio de venta estimado menos los costos de terminación y venta.</p>`});
  }
  let det=`<table class="ef"><thead><tr><th>Categoría</th><th>Cantidad de bienes</th><th>Valor</th></tr></thead><tbody>${Object.entries(porCat).map(([c,v])=>`<tr class="ind"><td>${esc(c)}</td><td class="n">${fmt(C.items.filter(b=>b.categoria===c).reduce((s,b)=>s+(+b.cantidad||1),0),0)}</td><td class="n">${fmt(v)}</td></tr>`).join('')}<tr class="gt"><td>Total</td><td></td><td class="n">${fmt(total)}</td></tr></tbody></table><p style="margin-top:6pt">El detalle de cada bien, con su descripción, identificación y documento de propiedad, se presenta en el Anexo 1.</p>`;
  bl.push({n:n++,t:'Bienes aportados',html:det});
  const porAp={};C.items.forEach(b=>{const k=b.aportante||'Sin aportante';porAp[k]=(porAp[k]||0)+(+b.cantidad||1)*(+b.valor||0);});
  const vn=e.vn||0;
  bl.push({n:n++,t:constit?'Capital social':'Aporte para aumento de capital',html:`<p>El aporte en bienes asciende a ${fmt(total)}, distribuido entre los accionistas de la siguiente manera:</p><table class="ef"><thead><tr><th>Accionista</th><th>Valor aportado</th><th>%</th>${vn?'<th>Acciones equivalentes</th>':''}</tr></thead><tbody>${Object.entries(porAp).map(([a,v])=>`<tr class="ind"><td>${esc(a)}</td><td class="n">${fmt(v)}</td><td class="n">${total?fmt(v/total*100):''}%</td>${vn?`<td class="n">${fmt(v/vn,0)}</td>`:''}</tr>`).join('')}<tr class="gt"><td>Total</td><td class="n">${fmt(total)}</td><td class="n">100,00%</td>${vn?`<td class="n">${fmt(total/vn,0)}</td>`:''}</tr></tbody></table>`});
  // corregir número de nota en estado
  const nDet=bl.find(b=>b.t==='Bienes aportados').n;pages[1]=pages[1].replace(/<td class="nt">\d+<\/td>/g,`<td class="nt">${nDet}</td>`);
  pages.push(pagina(encabezado(e,'Notas al inventario de bienes',fechaTxt)+bl.map(b=>`<div class="nota-t">${b.n}. ${esc(b.t)}</div>${b.html}`).join('')));
  pages.push(pagina(htmlInventario(e,C.items,'Anexo 1 – Inventario de bienes muebles e inmuebles',fechaTxt),true));
  const avisos=[];if(!total)avisos.push('Cargue los bienes y sus valores.');if(C.items.some(b=>!b.documento))avisos.push('Hay bienes sin documento de propiedad indicado.');if(C.items.some(b=>!b.aportante))avisos.push('Hay bienes sin aportante.');
  return {pages,avisos,total};
}

/* =================== FLUJO DE CAJA PROYECTADO =================== */
const SECS_P=[['ING','Ingresos de efectivo de la operación',1],['EGR','Egresos de efectivo de la operación',-1],['INV','Inversiones (egresos)',-1],['FINE','Financiamiento – entradas',1],['FINS','Financiamiento – salidas',-1]];
const MODELO_FLUJO=[['ING','Ventas de contado'],['ING','Cobranza de cuentas por cobrar'],['ING','Otros ingresos'],
 ['EGR','Compras de mercancía / materia prima'],['EGR','Sueldos, salarios y beneficios'],['EGR','Aportes parafiscales (IVSS, FAOV, INCES)'],['EGR','Alquiler'],['EGR','Servicios públicos'],
 ['EGR','Honorarios profesionales'],['EGR','Mantenimiento y reparaciones'],['EGR','Publicidad y mercadeo'],['EGR','Comisiones bancarias e IGTF'],['EGR','Impuestos municipales'],
 ['EGR','IVA por pagar (neto)'],['EGR','Impuesto sobre la renta (anticipos y definitiva)'],['EGR','Contribución especial protección de pensiones'],['EGR','Otros gastos'],
 ['INV','Adquisición de propiedades, planta y equipos'],['FINE','Préstamos recibidos'],['FINE','Aportes de accionistas'],['FINS','Amortización de préstamos'],['FINS','Intereses pagados'],['FINS','Dividendos']];
function calcProy(P){
  const M=+P.meses||12,g=(+P.pct||0)/100;
  const fac=(m,pct,ini)=>{const p=pct===''||pct==null||isNaN(pct)?g:(+pct)/100;const k=m-(ini-1);
    if(P.modo==='mensual')return Math.pow(1+p,k);if(P.modo==='anual_comp')return Math.pow(1+p,k/12);return Math.pow(1+p,Math.floor(m/12));};
  const filas=P.filas.map(f=>{const v=[];const ini=Math.max(1,+f.inicio||1);for(let m=0;m<M;m++){
    if(f.tipo==='unico')v.push(m===(+f.mes||1)-1?(+f.base||0):0);else v.push(m<ini-1?0:r2((+f.base||0)*fac(m,f.pct,ini)));}return {...f,v};});
  const sec={};SECS_P.forEach(([id,,s])=>{sec[id]=Array(M).fill(0);filas.filter(f=>f.sec===id).forEach(f=>f.v.forEach((x,i)=>sec[id][i]+=x*s));});
  const neto=Array(M).fill(0).map((_,i)=>r2(SECS_P.reduce((s,[id])=>s+sec[id][i],0)));
  const ini=[],fin=[];let s=+P.saldoIni||0;for(let i=0;i<M;i++){ini.push(r2(s));s=r2(s+neto[i]);fin.push(s);}
  const [y,mo]=(P.inicio||hoy().slice(0,7)).split('-').map(Number);
  const lbl=Array(M).fill(0).map((_,i)=>{const d=new Date(y,mo-1+i,1);return MES3[d.getMonth()]+'-'+String(d.getFullYear()).slice(2);});
  const anios=Math.ceil(M/12);
  return {M,filas,sec,neto,ini,fin,lbl,anios};
}
VISTAS.proyeccion=function(){
  const e=EMP();if(!e)return sinEmpresa('Flujo de caja proyectado');
  e.proyecciones=e.proyecciones||[];
  let P=e.proyecciones.find(x=>x.id===DB.ui.proy);
  $('#main').innerHTML=`<h1>Flujo de caja proyectado</h1><p class="sub">Proyecciones de ${esc(e.razon)} a 12, 24, 36, 48 o 60 meses, con un % de variación general o por concepto.</p>
  <div class="card"><div class="row"><div class="f w2"><label>Proyecciones guardadas</label><select id="pSel"><option value="">— seleccione —</option>${e.proyecciones.map(x=>`<option value="${x.id}"${P&&x.id===P.id?' selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
   <div class="f sm"><button class="btn" id="pNew">+ Nueva (modelo genérico)</button></div>${e.periodos.length?`<div class="f sm"><button class="btn sec" id="pNewE">+ Nueva desde EEFF</button></div>`:''}${P?'<div class="f sm"><button class="btn sec sm" id="pDup">Duplicar</button></div><div class="f sm"><button class="btn bad sm" id="pDel">Eliminar</button></div>':''}</div></div>
  <div id="pForm"></div>`;
  const nueva=(filas,saldo,nombre)=>{const d=new Date();const n={id:uid(),nombre:nombre||'Proyección '+hoy(),inicio:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,meses:12,pct:5,modo:'anual',saldoIni:saldo||0,filas};
    e.proyecciones.push(n);DB.ui.proy=n.id;guardar();VISTAS.proyeccion();};
  $('#pSel').onchange=ev=>{DB.ui.proy=ev.target.value;VISTAS.proyeccion();};
  $('#pNew').onclick=()=>nueva(MODELO_FLUJO.map(([s,c])=>({id:uid(),sec:s,concepto:c,base:0,pct:'',tipo:'rec',inicio:1,mes:1})));
  if($('#pNewE'))$('#pNewE').onclick=()=>{
    modal(`<h2 style="margin-top:0">Crear proyección desde estados financieros</h2><div class="f"><label>Período base</label>${selHTML('mPer',e.periodos.map(p=>[p.id,`${p.nombre} (${fCorta(p.desde)} – ${fCorta(p.hasta)})`]),(PER()||{}).id)}</div>
    <div class="f" style="margin-top:8px"><label>Detalle</label>${selHTML('mDet',[['rubro','Por rubro del estado de resultados'],['cuenta','Por cuenta contable']],'rubro')}</div>
    <p class="hint">El valor base mensual es el saldo del período dividido entre los meses del período. Se excluyen depreciación, amortización, diferencia en cambio y REME (no son movimientos de efectivo). El saldo inicial de caja se toma del efectivo al cierre.</p>
    <div class="btns"><button class="btn" id="mOk">Crear</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);
    $('#mOk').onclick=()=>{const p=e.periodos.find(x=>x.id===$('#mPer').value);const det=$('#mDet').value;const V=restaV(valores(e,p,'sf'),valores(e,p,'si'));V.R.EFE=valores(e,p,'sf').R.EFE;const meses=mesesEntre(p.desde,p.hasta);
      const nocash=a=>/deprec|amortiz/.test(norm(a.n));const filas=[];
      const ex=['DIF_CAMB','REME','ORI'];
      if(det==='rubro'){
        const dep={};p.cuentas.forEach(a=>{if(nocash(a)){const r=rubroDe(e,a);dep[r]=(dep[r]||0)+a.sf-a.si;}});
        ERI_FACE.filter(l=>l.r&&!ex.includes(l.r[0])).forEach(l=>{const r=l.r[0];const v=r2(-(V.R[r]-(dep[r]||0)));if(Math.abs(v)<0.005)return;
          filas.push({id:uid(),sec:v>0?'ING':'EGR',concepto:RUB[r].nombre,base:r2(Math.abs(v)/meses),pct:'',tipo:'rec',inicio:1,mes:1});});
      }else{
        p.cuentas.forEach(a=>{const r=rubroDe(e,a);const mv=a.sf-a.si;if(RUB[r].est!=='ERI'||ex.includes(r)||nocash(a)||Math.abs(mv)<0.005)return;const v=-mv;
          filas.push({id:uid(),sec:v>0?'ING':'EGR',concepto:a.n,base:r2(Math.abs(v)/meses),pct:'',tipo:'rec',inicio:1,mes:1});});
      }
      ['INV','FINE','FINS'].forEach(s=>MODELO_FLUJO.filter(m=>m[0]===s).forEach(([x,c])=>filas.push({id:uid(),sec:x,concepto:c,base:0,pct:'',tipo:'rec',inicio:1,mes:1})));
      cerrarModal();nueva(filas,r2(V.R.EFE),'Proyección desde '+p.nombre);};
  };
  if($('#pDel'))$('#pDel').onclick=()=>{if(!confirm('¿Eliminar esta proyección?'))return;e.proyecciones=e.proyecciones.filter(x=>x!==P);DB.ui.proy=null;guardar();VISTAS.proyeccion();};
  if($('#pDup'))$('#pDup').onclick=()=>{const n={...clone(P),id:uid(),nombre:P.nombre+' (copia)'};e.proyecciones.push(n);DB.ui.proy=n.id;guardar();VISTAS.proyeccion();};
  if(!P)return;
  $('#pForm').innerHTML=`<div class="card"><div class="row">
    <div class="f w2"><label>Nombre</label><input id="pNom" value="${esc(P.nombre)}"></div>
    <div class="f"><label>Mes de inicio</label><input type="month" id="pIni" value="${P.inicio}"></div>
    <div class="f sm"><label>Meses a proyectar</label>${selHTML('pMes',[12,24,36,48,60].map(m=>[String(m),m+' meses']),String(P.meses))}</div>
    <div class="f sm"><label>% de variación general</label><input type="number" step="any" id="pPct" value="${P.pct}"></div>
    <div class="f w2"><label>Cómo se aplica el %</label>${selHTML('pModo',[['anual','Anual escalonado (cada 12 meses)'],['anual_comp','Anual, distribuido mes a mes (compuesto)'],['mensual','Mensual compuesto (% cada mes)']],P.modo)}</div>
    <div class="f"><label>Saldo inicial de caja</label><input type="number" step="any" id="pSal" value="${P.saldoIni}"></div>
  </div></div>
  <div class="card"><h3 style="margin-top:0">Conceptos (monto base mensual)</h3><p class="hint">% propio: deje vacío para usar el % general. Tipo "único" coloca el monto solo en el mes indicado (ej.: compra de un equipo). "Desde mes" permite iniciar un concepto recurrente más adelante.</p><div id="pFil"></div></div>
  <div class="card"><div class="btns" style="margin-top:0"><button class="btn sec" id="pPrint">Imprimir / PDF</button><button class="btn sec" id="pWord">Word</button><button class="btn sec" id="pXls">Excel</button></div>
   <h3>Resumen anual</h3><div id="pRes"></div><h3>Saldo de caja proyectado</h3><canvas id="pChart" class="chart"></canvas><h3>Detalle mensual</h3><div class="scroll" id="pDet"></div></div>`;
  const recalc=()=>{guardar();const R=calcProy(P);P._R=R;
    // resumen anual
    const an=Array(R.anios).fill(0).map((_,a)=>{const sl=v=>v.slice(a*12,a*12+12).reduce((s,x)=>s+x,0);return {sec:Object.fromEntries(SECS_P.map(([id])=>[id,sl(R.sec[id])])),neto:sl(R.neto),ini:R.ini[a*12],fin:R.fin[Math.min(R.M,a*12+12)-1]};});
    $('#pRes').innerHTML=`<table class="t"><thead><tr><th></th>${an.map((_,i)=>`<th class="n">Año ${i+1}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
      ${SECS_P.map(([id,t])=>`<tr><td>${t}</td>${an.map(a=>`<td class="n">${fmt(a.sec[id])}</td>`).join('')}<td class="n">${fmt(an.reduce((s,a)=>s+a.sec[id],0))}</td></tr>`).join('')}
      <tr style="font-weight:600"><td>Flujo neto</td>${an.map(a=>`<td class="n">${fmt(a.neto)}</td>`).join('')}<td class="n">${fmt(an.reduce((s,a)=>s+a.neto,0))}</td></tr>
      <tr><td>Saldo inicial</td>${an.map(a=>`<td class="n">${fmt(a.ini)}</td>`).join('')}<td></td></tr><tr style="font-weight:600"><td>Saldo final</td>${an.map(a=>`<td class="n">${fmt(a.fin)}</td>`).join('')}<td></td></tr></tbody></table>`;
    $('#pDet').innerHTML=tablaProyHTML(R,0,R.M,'t');
    dibujarGrafico($('#pChart'),R);
  };
  const bind=(id,k,f=v=>v)=>{$('#'+id).onchange=ev=>{P[k]=f(ev.target.value);recalc();};};
  bind('pNom','nombre');bind('pIni','inicio');bind('pMes','meses',v=>+v);bind('pPct','pct',v=>parseFloat(v)||0);bind('pModo','modo');bind('pSal','saldoIni',v=>parseFloat(v)||0);
  grid($('#pFil'),P.filas,[{k:'sec',l:'Sección',t:'sel',o:SECS_P.map(([a,b])=>[a,b]),def:'EGR'},{k:'concepto',l:'Concepto',w:'28%'},{k:'base',l:'Monto base mensual',t:'num'},{k:'pct',l:'% propio',t:'num',def:'',w:'80px'},
    {k:'tipo',l:'Tipo',t:'sel',o:[['rec','Recurrente'],['unico','Único']],def:'rec'},{k:'inicio',l:'Desde mes',t:'num',def:1,w:'70px'},{k:'mes',l:'Mes (único)',t:'num',def:1,w:'70px'}],{onChange:()=>recalc()});
  $('#pXls').onclick=()=>{const R=P._R;const aoa=[[e.razon],['Flujo de caja proyectado – '+P.nombre],[`Variación ${P.pct}% (${P.modo})`],[],['Concepto',...R.lbl,'Total']];
    SECS_P.forEach(([id,t,s])=>{aoa.push([t]);R.filas.filter(f=>f.sec===id).forEach(f=>aoa.push([f.concepto,...f.v.map(v=>r2(v*s)),r2(f.v.reduce((a,b)=>a+b,0)*s)]));aoa.push(['Total '+t.toLowerCase(),...R.sec[id].map(r2),r2(R.sec[id].reduce((a,b)=>a+b,0))]);});
    aoa.push([],['Flujo neto del mes',...R.neto],['Saldo inicial',...R.ini],['Saldo final',...R.fin]);
    exportarExcel([{n:'Flujo proyectado',aoa}],`Flujo_proyectado_${e.razon}`);};
  const paginasProy=()=>{const R=P._R;const pg=[];
    for(let a=0;a<R.anios;a++){pg.push(pagina(encabezado(e,'Flujo de caja proyectado',`${P.nombre} – Año ${a+1} (${R.lbl[a*12]} a ${R.lbl[Math.min(R.M,a*12+12)-1]})`)+tablaProyHTML(R,a*12,Math.min(R.M,a*12+12),'ef sm')+`<div class="pie">Supuesto de variación: ${fmt(P.pct)}% ${P.modo==='mensual'?'mensual compuesto':P.modo==='anual_comp'?'anual distribuido mensualmente':'anual escalonado'}. Cifras expresadas en ${esc(e.moneda||'bolívares')}.</div>`,true,{pie:0}));}
    return pg;};
  const MP=()=>({emp:e,doc:'Flujo de Caja Proyectado',sub:P.nombre,conHoja:false});
  $('#pPrint').onclick=()=>{const tmp=document.createElement('div');tmp.className='doc';mostrarDoc(tmp,paginasProy(),MP());dialogoImprimir(tmp);};
  $('#pWord').onclick=()=>exportarWord(paginasProy(),`Flujo_proyectado_${e.razon}`,MP());
  recalc();
};
function tablaProyHTML(R,a,b,cls){
  const rng=v=>v.slice(a,b);const tot=v=>rng(v).reduce((s,x)=>s+x,0);
  let h=`<table class="${cls}"><thead><tr><th>Concepto</th>${R.lbl.slice(a,b).map(l=>`<th class="n">${l}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>`;
  SECS_P.forEach(([id,t,s])=>{const fs=R.filas.filter(f=>f.sec===id);if(!fs.length)return;h+=`<tr class="h2"><td colspan="${b-a+2}"><b>${t}</b></td></tr>`;
    fs.forEach(f=>{h+=`<tr class="ind"><td>${esc(f.concepto)}</td>${rng(f.v).map(v=>`<td class="n">${fmtD(v*s)}</td>`).join('')}<td class="n">${fmtD(tot(f.v)*s)}</td></tr>`;});
    h+=`<tr class="st"><td>Total</td>${rng(R.sec[id]).map(v=>`<td class="n">${fmtD(v)}</td>`).join('')}<td class="n">${fmtD(tot(R.sec[id]))}</td></tr>`;});
  h+=`<tr class="st"><td>Flujo neto del mes</td>${rng(R.neto).map(v=>`<td class="n">${fmtD(v)}</td>`).join('')}<td class="n">${fmtD(tot(R.neto))}</td></tr>`;
  h+=`<tr><td>Saldo inicial de caja</td>${rng(R.ini).map(v=>`<td class="n">${fmtD(v)}</td>`).join('')}<td></td></tr>`;
  h+=`<tr class="gt"><td>Saldo final de caja</td>${rng(R.fin).map(v=>`<td class="n">${fmtD(v)}</td>`).join('')}<td></td></tr>`;
  return h+'</tbody></table>';
}
function dibujarGrafico(cv,R){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||800,H=cv.clientHeight||280;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const pl=70,pr=14,pt=14,pb=28;const vals=[...R.fin,...R.neto,0];const mx=Math.max(...vals),mn=Math.min(...vals);const rg=(mx-mn)||1;
  const y=v=>pt+(mx-v)/rg*(H-pt-pb);const bw=(W-pl-pr)/R.M;
  g.font='11px Segoe UI, Arial';g.fillStyle='#64748b';g.strokeStyle='#e2e8f0';
  for(let i=0;i<=4;i++){const v=mn+rg*i/4;const yy=y(v);g.beginPath();g.moveTo(pl,yy);g.lineTo(W-pr,yy);g.stroke();g.fillText(abrev(v),4,yy+4);}
  g.strokeStyle='#94a3b8';g.beginPath();g.moveTo(pl,y(0));g.lineTo(W-pr,y(0));g.stroke();
  R.neto.forEach((v,i)=>{g.fillStyle=v>=0?'rgba(46,117,182,.35)':'rgba(185,28,28,.35)';const x=pl+i*bw+bw*.15;g.fillRect(x,Math.min(y(v),y(0)),bw*.7,Math.abs(y(v)-y(0)));});
  g.strokeStyle='#1f4e79';g.lineWidth=2;g.beginPath();R.fin.forEach((v,i)=>{const x=pl+i*bw+bw/2;i?g.lineTo(x,y(v)):g.moveTo(x,y(v));});g.stroke();g.lineWidth=1;
  g.fillStyle='#64748b';const step=Math.ceil(R.M/12);R.lbl.forEach((l,i)=>{if(i%step===0)g.fillText(l,pl+i*bw,H-8);});
  g.fillStyle='#1f4e79';g.fillText('— Saldo final de caja',W-260,14);g.fillStyle='#2e75b6';g.fillText('■ Flujo neto del mes',W-130,14);
}
function abrev(v){const a=Math.abs(v);if(a>=1e9)return (v/1e9).toFixed(1)+' MM';if(a>=1e6)return (v/1e6).toFixed(1)+' M';if(a>=1e3)return (v/1e3).toFixed(0)+' mil';return v.toFixed(0);}

/* =================== INICIO =================== */
$('#topLogo').src=impDef().logoData||LOGO_CONTALFA;
refrescarSelects();
ir(DB.ui.view||'empresas');
if(DB.ui.emp)$('#saveInfo').textContent='Datos guardados en este navegador';
</script>
