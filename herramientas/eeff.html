<!DOCTYPE html>
<html lang="es">
<head>
<script src="/assets/bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EEFF VEN-NIF · Generador de Estados Financieros</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1d2733;--mute:#64748b;--line:#dde3ea;--pri:#1f4e79;--pri2:#2e75b6;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--soft:#eef3f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--pri);color:#fff;padding:8px 16px}
.top .brand{font-size:17px;letter-spacing:.3px;margin-right:10px}
.top label{font-size:12px;opacity:.95;display:flex;align-items:center;gap:6px}
.top select{min-width:180px;max-width:320px;padding:5px 6px;border-radius:5px;border:0}
.top .spacer{flex:1}
#saveInfo{font-size:12px;opacity:.8}
.layout{display:flex;min-height:calc(100vh - 48px)}
nav{width:215px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 8px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--soft)}
nav button.on{background:var(--pri);color:#fff}
nav .sep{font-size:11px;text-transform:uppercase;color:var(--mute);margin:12px 12px 4px;letter-spacing:.5px}
main{flex:1;padding:18px 22px;min-width:0}
h1{font-size:21px;margin:0 0 4px;color:var(--pri)}
h2{font-size:16px;margin:18px 0 8px;color:var(--pri)}
h3{font-size:14px;margin:12px 0 6px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:140px;flex:1}
.f.w2{flex:2}.f.w3{flex:3}.f.sm{flex:0 0 auto;min-width:120px}
.f label,.lbl{font-size:12px;color:var(--mute)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #c9d2dc;border-radius:5px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.chk{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:13px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#fff;color:var(--pri)}
.btn.sec:hover{background:var(--soft)}
.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle}
table.t th{background:var(--soft);font-weight:600;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:hover td{background:#fafcff}
.scroll{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:6px}
table.grid th{background:var(--soft);font-weight:600;text-align:left;padding:5px;font-size:12px}
table.grid td{padding:2px 3px;border-bottom:1px solid #eef1f4}
table.grid input,table.grid select{padding:4px 6px;font-size:13px}
table.grid tfoot td{font-weight:600;padding:5px}
button.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--soft);color:var(--pri)}
.pill.auto{background:#fff4e0;color:var(--warn)}
.pill.ok{background:#e6f6ec;color:var(--ok)}
.pill.bad{background:#fde8e8;color:var(--bad)}
.msg{padding:9px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.msg.ok{background:#e6f6ec;color:#14532d}
.msg.warn{background:#fff4e0;color:#7c2d12}
.msg.bad{background:#fde8e8;color:#7f1d1d}
.msg.info{background:var(--soft);color:#1e3a5f}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--mute)}
.kpi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;font:inherit;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mute)}
#toast{position:fixed;bottom:18px;right:18px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:7px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none;max-width:420px}
#toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:10px;padding:18px 20px;max-width:760px;width:94%;max-height:88vh;overflow:auto}
.split{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.prevwrap{background:#e5e9ef;border-radius:8px;padding:16px;overflow:auto;max-height:80vh}
.hint{font-size:12px;color:var(--mute)}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12px}
.chart{width:100%;height:280px;background:#fff;border:1px solid var(--line);border-radius:8px}

/* ====== Documento (vista previa, impresión y Word) ====== */
.doc{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:10.5pt;line-height:1.42}
.doc .page{background:#fff;width:210mm;min-height:297mm;padding:22mm 20mm 20mm 22mm;margin:0 auto 14px;box-shadow:0 1px 6px rgba(0,0,0,.18);position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .page.land{width:297mm;min-height:210mm}
.doc p{margin:0 0 .8em;text-align:justify}
.doc .dt{text-align:center;font-weight:bold;font-size:1.13em;margin:0 0 1.2em}
.doc .ds{font-weight:bold;margin:1em 0 .5em}
.doc .dh{text-align:center;margin-bottom:1em}
.doc .dh .e{font-weight:bold;font-size:1.13em;text-transform:uppercase}
.doc .dh .ti{font-weight:bold;margin-top:.5em;text-transform:uppercase}
.doc .dh .mo{font-style:italic;font-size:.9em}
.doc table.ef{width:100%;border-collapse:collapse;font-size:.95em}
.doc table.ef th{border-bottom:1px solid #000;padding:.3em .4em;font-weight:bold;text-align:right}
.doc table.ef th:first-child{text-align:left}
.doc table.ef td{padding:.18em .4em}
.doc table.ef td.n{width:8em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.doc table.ef td.nt{text-align:center;width:3.4em}
.doc table.ef tr.h td{font-weight:bold;padding-top:.75em;text-transform:uppercase}
.doc table.ef tr.h2 td{font-weight:bold;font-style:italic;padding-top:.55em}
.doc table.ef tr.st td{font-weight:bold}
.doc table.ef tr.st td.n{border-top:1px solid #000}
.doc table.ef tr.gt td{font-weight:bold}
.doc table.ef tr.gt td.n{border-top:1px solid #000;border-bottom:3px double #000}
.doc table.ef tr.ind td:first-child{padding-left:1.4em}
.doc table.ef tr.ind2 td:first-child{padding-left:2.5em}
.doc table.ef tr.van td{font-weight:bold;font-style:italic;border-top:1px dotted #000}
.doc table.ef tr.vienen td{font-weight:bold;font-style:italic;border-bottom:1px dotted #000}
.doc table.ef.ecp th{text-align:right;font-size:.9em;vertical-align:bottom}
.doc table.ef.ecp td{font-size:.9em;width:auto}
.doc table.ef.ecp td:first-child{width:28%}
#pDet td:first-child{min-width:230px}
.doc table.ef.sm td,.doc table.ef.sm th{font-size:.8em;padding:.15em .3em}
.doc .pie{font-size:.86em;font-style:italic;margin-top:1.2em}
.doc .firma{margin-top:3em}
.doc .firma .raya{margin-top:3.2em}
.doc .portada{text-align:center;padding-top:55mm}
.doc .portada .e{font-size:1.7em;font-weight:bold;text-transform:uppercase}
.doc .portada .t{font-size:1.45em;font-weight:bold;margin-top:2em}
.doc .indice{margin:3em auto 0;width:75%;text-align:left}
.doc .nota-t{font-weight:bold;margin:1.2em 0 .5em}
.doc .ph{background:#fff3b0}
/* páginas físicas (paginadas) */
.doc .page.fis{height:297mm;min-height:0;padding:11mm 15mm 9mm 20mm;display:flex;flex-direction:column;overflow:hidden}
.doc .page.fis.land{height:210mm;width:297mm}
.doc .fis .rh{display:flex;align-items:center;gap:12pt;border-bottom:2.2pt solid var(--doc-c,#1f4e79);padding-bottom:5pt;margin-bottom:12pt;flex:none}
.doc .fis .rh img{height:34pt;width:auto}
.doc .fis .rh .rhe{flex:1;line-height:1.25}
.doc .fis .rh .rhe .n{font-weight:bold;font-size:1.08em;text-transform:uppercase;color:var(--doc-c,#1f4e79)}
.doc .fis .rh .rhe .r{font-size:.82em;color:#333}
.doc .fis .rh .rhd{text-align:right;line-height:1.25}
.doc .fis .rh .rhd .t{font-weight:bold;font-size:.95em;color:var(--doc-c,#1f4e79)}
.doc .fis .rh .rhd .s{font-size:.8em;color:#444}
.doc .fis .pb{flex:1;overflow:hidden;min-height:0}
.doc .fis .pf{flex:none;border-top:.8pt solid #8a9bb0;padding-top:4pt;margin-top:6pt;font-size:.78em;display:flex;justify-content:space-between;gap:12pt;color:#222}
.doc .fis .pf .hs{font-weight:bold}
.doc .fis .dh .e,.doc .fis .dh .rif{display:none}
.doc .fis .dh .ti{margin-top:0}
.doc .fis .portada{padding-top:45mm}
@page{size:A4;margin:0}
@page land{size:A4 landscape;margin:0}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .page{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  #printRoot .page:last-child{page-break-after:auto;break-after:auto}
  #printRoot .page.land{page:land}
  .doc .ph{background:none}
}
#printRoot{display:none}
</style>
</head>
<body>
<header class="top">
  <img id="topLogo" alt="Contalfa" style="height:30px;background:#fff;border-radius:6px;padding:3px 8px"><div class="brand">EEFF <b>VEN-NIF</b></div>
  <label>Empresa <select id="selEmp"></select></label>
  <label>Período <select id="selPer"></select></label>
  <span class="spacer"></span>
  <span id="saveInfo"></span>
</header>
<div class="layout">
  <nav id="nav">
    <div class="sep">Clientes</div>
    <button data-v="empresas">Empresas</button>
    <button data-v="importar">Importar balance</button>
    <button data-v="mapeo">Clasificación de cuentas</button>
    <div class="sep">Informes</div>
    <button data-v="eeff">Estados financieros</button>
    <button data-v="aumento">Aumento de capital</button>
    <button data-v="bienes">Certificación de bienes</button>
    <button data-v="proyeccion">Flujo de caja proyectado</button>
    <div class="sep">Sistema</div>
    <button data-v="config">Configuración</button>
    <button data-v="respaldo">Respaldo de datos</button>
  </nav>
  <main id="main"></main>
</div>
<div id="printRoot" class="doc"></div>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbody"></div></div>

function fmt(n,dec){

  let v=+n; if(Math.abs(v)<(d?0.005:0.5))v=0;
  const s=Math.abs(v).toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d});

}

function parseNum(v){
  if(v==null)return NaN;
  if(typeof v==='number')return v;
  let s=String(v).trim(); if(!s)return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  s=s.replace(/[^\d.,\-]/g,'');
  if(s.startsWith('-')){neg=!neg;s=s.slice(1);}
  if(!/\d/.test(s)||/-/.test(s))return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){ if(lc>ld) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(lc>-1){ s=(/,\d{1,2}$/.test(s)&&(s.match(/,/g)||[]).length===1)?s.replace(',','.'):s.replace(/,/g,''); }
  else if(ld>-1){ if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,''); }
  const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n);
}

    if(T(/impuesto diferido/))return 'AID';
    if(T(/socio|accionista|relacionad|director|afiliad|vinculad|casa matriz|filial/))return 'CXC_REL';
    if(T(/\biva\b|retencion|retenido|i\.?s\.?l\.?r|islr|impuesto|credito fiscal|tributari|seniat|\bfnd\b/)||TG(/administracion tributaria|impuestos? y tributos/))return 'IMP_ACT';
    if(T(/anticipo|pagad[oa]s? por anticipado|prepagad|anticipad|seguros? pagad|poliza/))return 'ANTIC';
    if(TG(/inventari|mercanc|materia prima|productos? (terminad|en proceso)|mercaderia|en transito|repuesto/))return 'INVENT';
    if(T(/cliente|tarjeta|comercial|efectos? por cobrar|documentos? por cobrar/))return 'CXC_COM';
    if(TG(/cobrar|deudor|empleado/))return 'OTRAS_CXC';
    if(T(/intangib|software|licencia|marca|plusval|derecho|programa|aplicacion(es)? informatica/))return 'INTANG';
    if(T(/propiedad(es)? de inversion/))return 'PROP_INV';
    if(TG(/terreno|edific|maquin|equipo|mobili|vehicul|mejora|instalac|propiedad|planta|herramient|obras? en (curso|proceso)|construcc|inmueble|mueble|enseres|computa/))return 'PPE';
    if(TG(/gastos? (pagados? )?anticipad|diferid/))return 'ANTIC';
    return pz==='NC'?'OTROS_ANC':'OTROS_AC';
  }
  if(cl==='P'){
    if(T(/impuesto diferido/))return 'PID';
    if(T(/dividend/))return 'DIV_PAG';
    if(T(/prestamo|sobregiro|financiamiento|pagare|hipotec|obligacion(es)? financ|credito bancario|tarjeta de credito|linea de credito/))return pz==='NC'?'PREST_LP':'PREST_CP';
    if(T(/socio|accionista|acconista|relacionad|director|afiliad|vinculad|casa matriz/))return 'CXP_REL';
    if(T(/prestaciones|antiguedad|indemniz/))return pz==='NC'?'BEN_LP':'BEN_CP';
    if(T(/anticipo|cobrad[oa]s? por anticipado|ingresos? diferid/))return 'ANT_CLI';
    if(T(/nomina|sueldo|salario|remunerac|utilidades|vacacion|bono|propina|liquidacion|beneficio|aguinaldo/)&&!T(/seguridad social|faov|inces|\bsso\b|ivss/))return pz==='NC'?'BEN_LP':'BEN_CP';
    if(T(/\biva\b|islr|i\.?s\.?l\.?r|retencion|impuesto|tribut|seguridad social|seguro social|faov|inces|\bsso\b|ivss|fonacit|\bfona\b|\bfnd\b|\blod\b|igtf|pension|lopcymat|patente|municipal|seniat|debito fiscal|parafiscal|aporte/)||TG(/administracion tributaria/))return 'IMP_PAS';
    if(T(/provision|estimacion|contingencia/)||TG(/provision|estimacion/))return pz==='NC'?'PROV_LP':'PROV_CP';
    if(T(/proveedor|comercial/))return pz==='NC'?'OTROS_PNC':'CXP_COM';
    if(pz==='NC')return 'OTROS_PNC';
    if(T(/transitori/))return 'OTROS_PC';
    return 'OTRAS_CXP';
  }
  if(cl==='K'){
    if(T(/futur|aporte/))return 'APORTES';
    if(T(/actualiz|ajuste por inflacion|reexpres|inflacion/))return 'ACT_PAT';
    if(T(/reserva legal|\blegal\b/))return 'RES_LEGAL';
    if(T(/superavit|revaluac|otro resultado integral|\bori\b/)&&!T(/acumulad|ganado|retenid/))return 'SUPERAVIT';
    if(T(/reserva/))return 'OTRAS_RES';
    if(T(/resultado del (ejercicio|periodo)|(utilidad|perdida|ganancia)(es)? del (ejercicio|periodo)/))return 'RES_EJ';
    if(T(/acumulad|retenid|no distribuid|resultado|utilidad|perdida|deficit/))return 'RA';
    if(T(/capital|accion/))return 'CAPITAL';
    return 'OTRAS_RES';
  }
  if(cl==='I'){
    if(T(/cambi/))return 'DIF_CAMB';
    if(T(/monetari|\breme\b/))return 'REME';
    if(T(/interes|financ|rendimient|dividendo/))return 'ING_FIN';
    if(T(/otros? ingreso|diverso|extraordinari|venta de activo|recuperac/)||(/otros ingresos|no operac/.test(norm(a.g))))return 'OTROS_ING';
    return 'ING_ORD';
  }
  if(cl==='C')return 'COSTO';
  if(cl==='G'){
    if(T(/impuesto sobre la renta|\bislr\b|i\.s\.l\.r|impuesto a la renta/)&&!T(/retenc/))return 'ISR';
    if(T(/cambi/)&&!T(/intercambi/))return 'DIF_CAMB';
    if(T(/monetari|\breme\b/))return 'REME';
    if(T(/interes|financ|comision(es)? banc|bancari|\bigtf\b|gastos? de banco/))return 'GAST_FIN';
    if(T(/venta|publicidad|marketing|mercadeo|propaganda|promocion|delivery|distribuc|comision(es)? (de|sobre) venta|flete/))return 'GAST_VENT';
    if(T(/no deducible|perdida en (venta|retiro)|extraordinari|siniestro|donacion|multa|sancion/))return 'OTROS_GAST';
    return 'GAST_ADM';
  }
  return 'SIN';
}

// cols: [{k,l,t:'text'|'num'|'sel'|'date',o:[[v,l]],w}]
function grid(el,rows,cols,opt={}){
  const cell=(c,r,i)=>{
    const v=r[c.k]??'';
    if(c.t==='sel')return `<select data-i="${i}" data-k="${c.k}">${(typeof c.o==='function'?c.o():c.o).map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
    if(c.t==='ro')return `<span>${esc(c.f?c.f(r):v)}</span>`;
    return `<input data-i="${i}" data-k="${c.k}" type="${c.t==='num'?'number':c.t==='date'?'date':'text'}" ${c.t==='num'?'step="any"':''} value="${esc(v)}">`;
  };
  const foot=()=>opt.foot?`<tfoot>${opt.foot(rows)}</tfoot>`:'';
  const draw=()=>{
    el.innerHTML=`<table class="grid"><thead><tr>${cols.map(c=>`<th style="${c.w?'width:'+c.w:''}">${esc(c.l)}</th>`).join('')}<th style="width:28px"></th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${cell(c,r,i)}</td>`).join('')}<td><button class="x" title="Eliminar" data-del="${i}">✕</button></td></tr>`).join('')}</tbody>${foot()}</table>
    <button class="btn sec sm" data-add="1">+ Agregar fila</button>`;
  };
  draw();
  el.oninput=el.onchange=e=>{
    const t=e.target;if(t.dataset.k==null||t.dataset.i==null)return;
    const c=cols.find(c=>c.k===t.dataset.k);const r=rows[+t.dataset.i];
    r[c.k]=c.t==='num'?(t.value===''?'':parseFloat(t.value)):t.value;
    const tf=el.querySelector('tfoot');if(tf&&opt.foot)tf.innerHTML=opt.foot(rows);
    $$('[data-ro]',el);
    if(opt.onChange)opt.onChange(e.type);
  };
  el.onclick=e=>{
    const t=e.target;
    if(t.dataset.add){const n={id:uid()};cols.forEach(c=>n[c.k]=c.def??(c.t==='num'?0:''));rows.push(n);draw();opt.onChange&&opt.onChange('add');}
    else if(t.dataset.del!=null){rows.splice(+t.dataset.del,1);draw();opt.onChange&&opt.onChange('del');}
  };
  return {redraw:draw};
}

const CODE_RE=/^\d+([.\-]\d+)*$/;
const COMB_RE=/^\s*(\d+(?:[.\-]\d+)*)\s*[-–:]?\s+(\S.*)$/;
function colLetra(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function esCodigo(v){if(typeof v!=='string')return false;const s=v.trim();return CODE_RE.test(s)&&!/^\d+[.,]\d{1,2}$/.test(s)&&s.length<=30;}
function esNum(v){return typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(parseNum(v))&&!/^\d+([.\-]\d+){2,}$/.test(v.trim()));}

function parseDelimitado(txt){
  const lines=txt.replace(/\r/g,'').split('\n').slice(0,20).join('\n');
  const cnt=ch=>(lines.match(new RegExp(ch==='\t'?'\t':'\\'+ch,'g'))||[]).length;
  const delim=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')],['|',cnt('|')]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f='';}
    else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(ch!=='\r')f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}

function detectarColumnas(rows){
  const ncol=Math.max(0,...rows.map(r=>r.length));
  const sc=Array(ncol).fill(0),ic=Array(ncol).fill(0),cc=Array(ncol).fill(0);
  const dist=Array.from({length:ncol},()=>new Set());
  rows.forEach(r=>r.forEach((v,j)=>{
    if(esCodigo(v)){sc[j]++;dist[j].add(String(v).trim());}
    else if(typeof v==='number'&&Number.isInteger(v)&&v>0&&v<1e13)ic[j]++;
    if(typeof v==='string'&&COMB_RE.test(v)&&!esCodigo(v))cc[j]++;
  }));
  // columnas con pocos valores distintos (orden, tipo, nivel: 1, 2, 3) no son códigos de cuenta
  for(let j=0;j<ncol;j++)if(dist[j].size<=5&&[...dist[j]].every(c=>/^\d{1,2}$/.test(c)))sc[j]=0;
  const m={code:-1,name:-1,comb:false,flex:false,codeCols:[],si:-1,d:-1,h:-1,sf:-1,sfD:-1,sfC:-1,signo:'auto',soloHojas:true};
  const mx=Math.max(...sc,0);
  // Formato mixto (p. ej. Aureos): códigos solos y "código + nombre" repartidos en varias columnas
  const mixtas=[];for(let j=0;j<ncol;j++)if(sc[j]+cc[j]>=3)mixtas.push(j);
  const totCC=cc.reduce((s,x)=>s+x,0);
  if(totCC>=3&&(mixtas.length>1||(mx>=3&&cc.some(x=>x>=3)))){m.flex=true;m.codeCols=mixtas.slice(0,3);m.code=mixtas[0];}
  else if(mx>=3){m.code=sc.findIndex(c=>c>=mx*0.5);}
  else{const mc=Math.max(...cc,0);
    if(mc>=3){m.code=m.name=cc.indexOf(mc);m.comb=true;}
    else{const mi=Math.max(...ic,0);if(mi>=3)m.code=ic.findIndex(c=>c>=mi*0.5);}}
  if(m.code<0)return m;
  const codeRows=rows.filter(r=>codigoDeFila(r,m)!=null);
  if(!m.comb){
    const tx=Array(ncol).fill(0);
    codeRows.forEach(r=>r.forEach((v,j)=>{if(j!==m.code&&typeof v==='string'&&v.trim().length>1&&!esNum(v)&&!(m.flex&&COMB_RE.test(v)))tx[j]++;}));
    const mt=Math.max(...tx,0);m.name=mt>0?tx.indexOf(mt):-1;
  }
  const numCols=[];const hdr0=filaEncabezado(rows,m)||[];
  for(let j=0;j<ncol;j++){if(j===m.code||j===m.name)continue;
    const c=codeRows.filter(r=>esNum(r[j])).length;if(c<codeRows.length*0.3)continue;
    // descartar columnas de nivel / orden / tipo (enteros pequeños), p. ej. sistema Global
    if(/^(nivel|orden|level|grupo|tipo|niv)\b/i.test(norm(hdr0[j]||'').trim()))continue;
    const vs=codeRows.map(r=>r[j]).filter(v=>v!==''&&v!=null).map(num);
    if(vs.some(v=>v!==0)&&vs.every(v=>Number.isInteger(v)&&v>=0&&v<=20))continue;
    numCols.push(j);}
  m.numCols=numCols;
  // probar combinaciones si,d,h,sf que cumplan SI + D - H = SF
  const val=(r,j)=>j<0?0:num(r[j]);
  let best=null;
  const N=numCols.length;
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let c=b+1;c<N;c++)for(let d=c+1;d<N;d++){
    const [si,de,ha,sf]=[numCols[a],numCols[b],numCols[c],numCols[d]];
    let ok=0,okN=0,tot=0;
    for(const r of codeRows){const S=val(r,si),D=val(r,de),H=val(r,ha),F=val(r,sf);
      if(Math.abs(D)+Math.abs(H)+Math.abs(F)<0.01)continue;tot++;
      const tol=Math.max(0.05,Math.abs(F)*1e-6);
      if(Math.abs(S+D-H-F)<tol)ok++;else if(Math.abs(S-D+H-F)<tol)okN++;}
    if(!tot)continue;
    const score=(ok+okN)/tot;
    if(!best||score>best.score+1e-9)best={score,si,de,ha,sf,ok,okN};
  }
  if(best&&best.score>=0.8){m.si=best.si;m.d=best.de;m.h=best.ha;m.sf=best.sf;m.signo=best.okN>best.ok*0.05?'nat':'signed';m.score=best.score;}
  else{
    // probar sin saldo inicial: D - H = SF
    let b3=null;
    for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let c=b+1;c<N;c++){
      let ok=0,tot=0;for(const r of codeRows){const D=val(r,numCols[a]),H=val(r,numCols[b]),F=val(r,numCols[c]);if(Math.abs(D)+Math.abs(H)<0.01)continue;tot++;if(Math.abs(D-H-F)<0.05||Math.abs(H-D-F)<0.05)ok++;}
      if(tot&&(!b3||ok/tot>b3.s))b3={s:ok/tot,a:numCols[a],b:numCols[b],c:numCols[c]};}
    // sin columna de saldo final (p. ej. Global: inicial, débitos, créditos): los encabezados mandan
    const hc={};hdr0.forEach((v,j)=>{if(!numCols.includes(j))return;const t=norm(v);
      if(/inicial|anterior/.test(t))hc.si=hc.si??j;else if(/deb|debe|cargo/.test(t))hc.d=hc.d??j;else if(/cred|haber|abono/.test(t))hc.h=hc.h??j;else if(/final|actual|^saldo/.test(t))hc.sf=hc.sf??j;});
    const porEnc=hc.si!=null&&hc.d!=null&&hc.h!=null&&hc.sf==null;
    if(!porEnc&&b3&&b3.s>=0.8){m.d=b3.a;m.h=b3.b;m.sf=b3.c;m.signo='signed';m.score=b3.s;}
    else{
      if(hc.si!=null&&hc.d!=null&&hc.h!=null){m.si=hc.si;m.d=hc.d;m.h=hc.h;m.sf=hc.sf??-1;m.signo='signed';m.score=hc.sf==null?0.9:0;m.sinSaldo=hc.sf==null;}
      else if(N){m.sf=numCols[N-1];if(N>=2)m.si=numCols[0];m.signo='signed';m.score=0;}
    }
  }
  // cabeceras deudor/acreedor
  const hdr=filaEncabezado(rows,m);
  if(hdr){hdr.forEach((v,j)=>{const t=norm(v);if(/deudor/.test(t)&&/final|actual|saldo/.test(t)&&m.score<0.8)m.sfD=j;if(/acreedor/.test(t)&&/final|actual|saldo/.test(t)&&m.score<0.8)m.sfC=j;});
    if(m.sfD>=0&&m.sfC>=0)m.sf=-1;}
  return m;
}
function filaEncabezado(rows,m){
  const first=rows.findIndex(r=>codigoDeFila(r,m)!=null);
  for(let i=first-1;i>=0&&i>=first-15;i--){const r=rows[i];const t=r.filter(v=>typeof v==='string').map(norm).join(' ');
    if(/deb|cred|saldo|inicial|haber|debe/.test(t)&&r.filter(v=>typeof v==='string'&&v.trim()).length>=2)return r;}
  for(let i=first-1;i>=0&&i>=first-8;i--){const r=rows[i];if(r.filter(v=>typeof v==='string'&&v.trim()).length>=2)return r;}
  return null;
}
// Devuelve {code,name,sub} de una fila de cuenta (o null)
function infoFila(r,m){
  if(m.flex){
    for(const j of m.codeCols){const v=r[j];if(typeof v!=='string'||!v.trim())continue;const t=v.trim();
      if(/^total\b/i.test(t))return null;
      if(esCodigo(t)){let nm='';for(let k=j+1;k<r.length;k++){const x=r[k];if(typeof x==='string'&&x.trim()&&isNaN(parseNum(x))){nm=x.trim();break;}}return {code:t,name:nm,sub:false};}
      const x=t.match(COMB_RE);if(x)return {code:x[1],name:x[2].trim(),sub:j!==m.codeCols[0]||/\s:\s|:\s/.test(x[2])};
    }
    return null;
  }
  const code=codigoDeFila(r,m);if(code==null)return null;
  return {code,name:m.comb?String(r[m.code]).match(COMB_RE)[2].trim():String(r[m.name]??'').trim(),sub:false};
}
function codigoDeFila(r,m){
  if(m.flex){const i=infoFila(r,m);return i?i.code:null;}
  if(m.code<0)return null;const v=r[m.code];
  if(m.comb){if(typeof v!=='string')return null;const x=v.match(COMB_RE);return x?x[1]:null;}
  if(esCodigo(v))return v.trim();
  if(typeof v==='number'&&Number.isInteger(v)&&v>0)return String(v);
  return null;
}
const CLASE_RE=[[/^activos?$/,'A'],[/^pasivos?$/,'P'],[/^(patrimonio( neto)?|capital contable|capital y reservas)$/,'K'],[/^ingresos?( operacionales)?$/,'I'],[/^(costos?( de ventas?| operacionales)?|costo de lo vendido)$/,'C'],[/^(gastos?|egresos)$/,'G'],[/^cuentas de orden$/,'X']];
const PLAZO_RE=[[/^(activos? |pasivos? )?(no corrientes?|no circulantes?|a largo plazo|largo plazo|fijos?)$/,'NC'],[/^(activos? |pasivos? )?(corrientes?|circulantes?|a corto plazo|corto plazo)$/,'C']];
function claseDeTexto(t){t=norm(t).replace(/^\s*\d+([.\-]\d+)*\.?\s+/,'').trim().replace(/\s+/g,' ');for(const [re,c] of CLASE_RE)if(re.test(t))return c;return null;}
function plazoDeTexto(t){t=norm(t).replace(/^\s*\d+([.\-]\d+)*\.?\s+/,'').trim().replace(/\s+/g,' ');for(const [re,c] of PLAZO_RE)if(re.test(t))return c;return null;}

function parsearBC(rows,m){
  const out=[];let cl='',pz='',heads=[];const avisos=[];
  const g=(r,j)=>j<0?null:num(r[j]);
  // primera pasada: filas con código
  for(const r of rows){
    const inf=infoFila(r,m);const code=inf?inf.code:null;
    if(code==null){
      const txts=r.filter(v=>typeof v==='string'&&v.trim()&&!/^[\d.,\-\sX]+$/i.test(v.trim()));
      const nums=[m.si,m.d,m.h,m.sf,m.sfD,m.sfC].filter(j=>j>=0).map(j=>r[j]).filter(v=>v!==''&&v!=null&&num(v)!==0);
      if(txts.length===1&&!nums.length&&!/^total/i.test(txts[0].trim())){
        const t=txts[0].trim().replace(/^\d+([.\-]\d+)*\.?\s+/,'');const c=claseDeTexto(t),p=plazoDeTexto(t);
        if(c){cl=c;pz='';heads=[];}else if(p){pz=p;heads=[];}else{heads.push(t);if(heads.length>3)heads.shift();}
      }else if(txts.length&&/^total/i.test(String(txts[0]).trim())){
        heads.pop();
      }
      continue;
    }
    let name=inf.name;
    if(/^total/i.test(name))continue;
    let si=null,sf=null,d=m.d>=0?g(r,m.d):null,h=m.h>=0?g(r,m.h):null;
    if(m.si>=0)si=g(r,m.si);
    if(m.sf>=0)sf=g(r,m.sf);else if(m.sfD>=0||m.sfC>=0)sf=(m.sfD>=0?g(r,m.sfD):0)-(m.sfC>=0?Math.abs(g(r,m.sfC)):0);
    out.push({c:code,n:name,cl,pz,g:heads.slice(-2).join(' / '),si,d,h,sf,sub:inf.sub});
  }
  // Duplicados: misma cuenta repetida (código solo + código y nombre) y subniveles de una cuenta de movimiento cuyo total ya viene en otra fila
  const porCod=new Map();out.forEach(a=>{if(!porCod.has(a.c))porCod.set(a.c,[]);porCod.get(a.c).push(a);});
  const drop=new Set();let nDup=0,nSub=0;const K=['si','d','h','sf'];const nn=s=>norm(s).replace(/\s+/g,' ').trim();
  for(const g0 of porCod.values()){if(g0.length<2)continue;
    for(let i=0;i<g0.length;i++)for(let j=i+1;j<g0.length;j++){const x=g0[i],y=g0[j];
      if(!drop.has(x)&&!drop.has(y)&&nn(x.n)===nn(y.n)&&K.every(k=>Math.abs((x[k]||0)-(y[k]||0))<0.05)){drop.add(x.sub?x:y);nDup++;}}
    const rest=g0.filter(x=>!drop.has(x));if(rest.length<2)continue;
    // regla Aureos: la cuenta de la columna principal (código + nombre) es el total; los subniveles se omiten
    const prin=rest.filter(x=>!x.sub),subs=rest.filter(x=>x.sub);
    if(prin.length===1&&subs.length){subs.forEach(x=>drop.add(x));nSub+=subs.length;continue;}
    for(const t of rest.filter(x=>!x.sub).concat(rest.filter(x=>x.sub))){const ot=rest.filter(x=>x!==t);
      const cuadra=K.every(k=>Math.abs((t[k]||0)-ot.reduce((s,x)=>s+(x[k]||0),0))<0.5);
      if(cuadra&&ot.every(x=>x.sub||nn(x.n).startsWith(nn(t.n)))){ot.forEach(x=>drop.add(x));nSub+=ot.length;break;}}
  }
  if(drop.size){const keep=out.filter(a=>!drop.has(a));out.length=0;out.push(...keep);}
  // padres por prefijo de código
  const codes=[...new Set(out.map(a=>a.c))].sort();
  const padres=new Set();
  for(let i=0;i<codes.length-1;i++){const c=codes[i],nx=codes[i+1];if(nx.startsWith(c)&&nx.length>c.length)padres.add(c);}
  const nombrePorCod={};out.forEach(a=>{if(padres.has(a.c))nombrePorCod[a.c]=a.n;});
  // clase desde nombres de padres
  out.forEach(a=>{
    const anc=codes.filter(c=>padres.has(c)&&a.c.startsWith(c)&&c!==a.c);
    if(anc.length){const ns=anc.map(c=>nombrePorCod[c]);
      if(!a.cl){for(const n of ns){const c=claseDeTexto(n);if(c){a.cl=c;break;}}}
      if(!a.pz){for(const n of ns){const p=plazoDeTexto(n);if(p)a.pz=p;}}
      a.g=[a.g,...ns.slice(-2)].filter(Boolean).join(' / ');}
  });
  let lista=m.soloHojas?out.filter(a=>!padres.has(a.c)):out;
  // completar saldos
  lista.forEach(a=>{
    if(a.sf==null&&a.si!=null&&a.d!=null&&a.h!=null)a.sf=a.si+a.d-a.h;
    if(a.si==null&&a.sf!=null&&a.d!=null&&a.h!=null)a.si=a.sf-a.d+a.h;
    if(a.si==null)a.si=0;if(a.sf==null)a.sf=0;if(a.d==null)a.d=0;if(a.h==null)a.h=0;
  });
  // signo según naturaleza
  if(m.signo==='nat'){
    lista.forEach(a=>{
      const tolD=Math.abs(a.si+a.d-a.h-a.sf)<0.05,tolC=Math.abs(a.si-a.d+a.h-a.sf)<0.05;
      let nat;
      if(tolD&&!tolC)nat='D';else if(tolC&&!tolD)nat='C';
      else{const c=claseDeTexto('')||claseDe(a);nat=['P','K','I'].includes(c)?'C':'D';}
      if(nat==='C'){a.si=-a.si;a.sf=-a.sf;}
    });
  }
  // claves y agregación de duplicados
  const map=new Map();
  lista.forEach(a=>{
    const k=a.c+'|'+norm(a.n).replace(/\s+/g,' ').slice(0,70);
    if(map.has(k)){const b=map.get(k);b.si+=a.si;b.sf+=a.sf;b.d+=a.d;b.h+=a.h;}
    else map.set(k,{k,c:a.c,n:a.n,g:a.g,cl:a.cl,pz:a.pz,si:r2(a.si),d:r2(a.d),h:r2(a.h),sf:r2(a.sf)});
  });
  const cuentas=[...map.values()].map(a=>({...a,si:r2(a.si),sf:r2(a.sf),d:r2(a.d),h:r2(a.h)}));
  const totSI=r2(cuentas.reduce((s,a)=>s+a.si,0)),totSF=r2(cuentas.reduce((s,a)=>s+a.sf,0));
  const totD=r2(cuentas.reduce((s,a)=>s+a.d,0)),totH=r2(cuentas.reduce((s,a)=>s+a.h,0));
  // comparar contra la fila "Total general" del reporte, si existe
  let tg=null;for(const r of rows){if(r.some(v=>typeof v==='string'&&/total\s*(:\s*)?total general|^\s*totales?\s*(generales?)?\s*$|^\s*total general/i.test(v))){const D=m.d>=0?num(r[m.d]):null,H=m.h>=0?num(r[m.h]):null;if(D||H)tg={D,H};}}
  return {cuentas,totSI,totSF,totD,totH,padres:padres.size,nDup,nSub,tg};
}

function iniciarImport(nombre,hojas){

function prepararHoja(){
  IMP.rows=IMP.hojas[IMP.hoja].map(r=>Array.isArray(r)?r:[]);

  else{const f=fechasSugeridas(emp);IMP.desde=IMP.desde||f.desde;IMP.hasta=IMP.hasta||f.hasta;}

  const txt=IMP.rows.slice(0,8).flat().filter(v=>typeof v==='string').join(' ');

function guardarImport(){
  const emp=EMP();const res=IMP.res;if(!res||!res.cuentas.length)return toast('No hay cuentas para guardar');

  const per={id:dest||uid(),nombre:$('#iNom').value||'Período',desde:$('#iDesde').value,hasta:$('#iHasta').value,origen:IMP.nombreArchivo,creado:hoy(),cuentas:res.cuentas};
  if(dest){const i=emp.periodos.findIndex(p=>p.id===dest);emp.periodos[i]=per;}else emp.periodos.push(per);
  emp.periodos.sort((a,b)=>(a.hasta||'').localeCompare(b.hasta||''));
  // clasificación automática para cuentas nuevas
  let nuevas=0;res.cuentas.forEach(a=>{if(!emp.mapa[a.k]){emp.mapa[a.k]={r:autoRubro(a),a:1};nuevas++;}});
  const volver=PRESET&&PRESET.volverA;DB.ui.per=volver||per.id;PRESET=null;guardar();IMP=null;
  toast(`Balance guardado (${res.cuentas.length} cuentas, ${nuevas} clasificadas automáticamente)`);
  refrescarSelects();ir(volver?'eeff':'mapeo');
}

// Valores firmados (deudor +). src: 'sf' (saldo final) | 'si' (saldo inicial)
function valores(emp,per,src){
  const R={};RUB_IDS.forEach(id=>R[id]=0);const A={};const AR={};
  for(const a of per.cuentas){const r=rubroDe(emp,a);const v=a[src]||0;A[a.k]=v;AR[a.k]=r;R[r]+=v;}
  RUB_IDS.forEach(id=>R[id]=r2(R[id]));
  let pl=0;RUB_IDS.forEach(id=>{if(RUB[id].est==='ERI')pl+=R[id];});
  const NIT=r2(-pl),ORI=r2(-R.ORI),NI=r2(NIT-ORI);
  return {R,A,AR,NIT,NI,ORI};
}
// Aplica ajustes [{r, v(firmado)}] a una copia de valores
function aplicarAjustes(V,ajustes){
  const W=clone(V);ajustes.forEach(a=>{W.R[a.r]=r2((W.R[a.r]||0)+a.v);});
  let pl=0;RUB_IDS.forEach(id=>{if(RUB[id].est==='ERI')pl+=W.R[id];});W.NIT=r2(-pl);W.ORI=r2(-W.R.ORI);W.NI=r2(W.NIT-W.ORI);return W;
}
// Contexto: ESF compara contra el saldo inicial del balance (cierre del período anterior).
// ERI, flujo de efectivo y cambios en el patrimonio comparan contra un período anterior guardado (tercer saldo).
// eriModo: 'acum' = resultados acumulados del ejercicio (saldo final del balance); 'mov' = solo el movimiento del período
function contexto(emp,per,comp,eriModo){
  const cur=valores(emp,per,'sf'),base=valores(emp,per,'si');
  const cmpFecha=addDays(per.desde,-1);const sinComp=comp==='none';const modo=eriModo==='mov'?'mov':'acum';
  let prev=null;
  if(comp&&comp!=='si'&&comp!=='none'){const p0=emp.periodos.find(x=>x.id===comp);if(p0&&p0.id!==per.id)prev={per:p0,cur:valores(emp,p0,'sf'),base:valores(emp,p0,'si'),baseFecha:addDays(p0.desde,-1),curFecha:p0.hasta};}
  const eriCur=modo==='mov'?restaV(cur,base):cur,eriPrev=prev?(modo==='mov'?restaV(prev.cur,prev.base):prev.cur):null;
  return {emp,per,cur,cmp:sinComp?null:base,base,prev,eriCur,eriPrev,eriModo:modo,sinComp,hayComp:!sinComp,eriComp:!!prev,curFecha:per.hasta,cmpFecha,baseFecha:cmpFecha,
    desde:per.desde,inicioEj:inicioEjercicio(emp,per.hasta),curLbl:colLabel(per.hasta,cmpFecha),cmpLbl:colLabel(cmpFecha,per.hasta),
    eriLbl:prev?colLabel(per.hasta,prev.per.hasta):colLabel(per.hasta),eriPrevLbl:prev?colLabel(prev.per.hasta,per.hasta):''};
}
// Movimiento del período (saldo final − saldo inicial): resultados del período aunque el sistema acumule el año
function restaV(V,W){const R={},A={};RUB_IDS.forEach(id=>R[id]=r2((V.R[id]||0)-(W.R[id]||0)));Object.keys(V.A).forEach(k=>A[k]=r2((V.A[k]||0)-(W.A[k]||0)));
  return {R,A,AR:V.AR,NIT:r2(V.NIT-W.NIT),NI:r2(V.NI-W.NI),ORI:r2(V.ORI-W.ORI)};}
// Primer día del ejercicio fiscal que contiene la fecha (según el mes de cierre de la empresa)
function inicioEjercicio(emp,iso){if(!iso)return '';const cm=+((emp&&emp.cierreMes)||12);const [y,m]=iso.split('-').map(Number);
  const yc=m>cm?y:y-1;return addDays(finDeMes(yc,cm),1);}
function mismoAnioAtras(iso){if(!iso)return iso;const [y,m,d]=iso.split('-');return `${+y-1}-${m}-${d}`;}
// Período anterior que sirve como comparativo (tercer saldo)
function periodoAnterior(emp,per){
  const len=mesesEntre(per.desde,per.hasta);const ant=addDays(per.desde,-1);
  const cand=emp.periodos.filter(x=>x.id!==per.id);
  const igualLen=x=>mesesEntre(x.desde,x.hasta)===len;
  if(emp.emision==='mensual'||len===1){const c=cand.find(x=>x.hasta===ant&&igualLen(x));if(c)return c;}
  const c2=cand.find(x=>x.desde===mismoAnioAtras(per.desde)&&x.hasta.slice(0,7)===mismoAnioAtras(per.hasta).slice(0,7));if(c2)return c2;
  return cand.find(x=>x.hasta===ant&&igualLen(x))||null;
}
function fechasPeriodoAnterior(emp,per){
  const len=mesesEntre(per.desde,per.hasta);
  if(emp.emision==='mensual'||len===1){const h=addDays(per.desde,-1);return {desde:h.slice(0,8)+'01',hasta:h};}
  const h=mismoAnioAtras(per.hasta);const hh=new Date(+h.slice(0,4),+h.slice(5,7),0).toISOString().slice(0,10);
  return {desde:mismoAnioAtras(per.desde),hasta:h.slice(8)===per.hasta.slice(8)?h:hh};
}
function finDeMes(y,m){const d=new Date(Date.UTC(y,m,0));return d.toISOString().slice(0,10);}
function colLabel(f,otra){if(!f)return '';if(otra&&f.slice(5)===otra.slice(5)&&f.slice(0,4)!==otra.slice(0,4))return f.slice(0,4);return fCorta(f);}

// ---------- Estructura del ESF ----------
const ESF_FACE=[
 {h:'ACTIVO'},{h2:'Activo corriente'},
 {r:['EFE']},{r:['INV_CP']},{r:['CXC_COM']},{r:['CXC_REL']},{r:['OTRAS_CXC']},{r:['IMP_ACT']},{r:['INVENT']},{r:['ANTIC']},{r:['OTROS_AC']},
 {st:'Total activo corriente',of:['AC']},
 {h2:'Activo no corriente'},
 {id:'PPE_N',t:'Propiedades, planta y equipos, neto',r:['PPE','DEP_PPE']},{r:['PROP_INV']},{id:'INT_N',t:'Activos intangibles, neto',r:['INTANG','AMORT_INT']},{r:['INV_LP']},{r:['AID']},{r:['OTROS_ANC']},
 {st:'Total activo no corriente',of:['ANC']},
 {gt:'TOTAL ACTIVO',of:['AC','ANC']},
 {h:'PASIVO Y PATRIMONIO'},{h2:'Pasivo corriente'},
 {r:['PREST_CP']},{r:['CXP_COM']},{r:['CXP_REL']},{r:['OTRAS_CXP']},{r:['BEN_CP']},{r:['IMP_PAS']},{r:['PROV_CP']},{r:['ANT_CLI']},{r:['DIV_PAG']},{r:['OTROS_PC']},
 {st:'Total pasivo corriente',of:['PC']},
 {h2:'Pasivo no corriente'},
 {r:['PREST_LP']},{r:['BEN_LP']},{r:['PID']},{r:['PROV_LP']},{r:['OTROS_PNC']},
 {st:'Total pasivo no corriente',of:['PNC']},
 {st:'Total pasivo',of:['PC','PNC']},
 {h2:'Patrimonio'},
 {r:['CAPITAL']},{r:['APORTES']},{r:['ACT_PAT']},{r:['RES_LEGAL']},{r:['OTRAS_RES']},{r:['SUPERAVIT']},{r:['RA']},{id:'RES_EJ',t:'Resultado integral del ejercicio',r:['RES_EJ'],ni:true},
 {st:'Total patrimonio',of:['PAT']},
 {gt:'TOTAL PASIVO Y PATRIMONIO',of:['PC','PNC','PAT']},
];
const ERI_FACE=[
 {r:['ING_ORD']},{r:['COSTO']},{sub:'Ganancia (pérdida) bruta'},
 {r:['OTROS_ING']},{r:['GAST_VENT']},{r:['GAST_ADM']},{r:['OTROS_GAST']},{sub:'Resultado de actividades de operación'},
 {r:['ING_FIN']},{r:['GAST_FIN']},{r:['DIF_CAMB']},{r:['REME']},{sub:'Resultado antes del impuesto sobre la renta'},
 {r:['ISR']},{sub:'Resultado neto del ejercicio',tot:true},
 {r:['ORI'],oriOnly:true},{sub:'Resultado integral total del ejercicio',tot:true,oriOnly:true},
];
const signoSec=sec=>(sec==='AC'||sec==='ANC')?1:-1;
function lineaId(l){return l.id||l.r[0];}
function lineaTit(l){return l.t||RUB[l.r[0]].nombre;}
// Valor mostrado (con signo de presentación) de una línea del ESF
function valESF(l,V){const s=signoSec(RUB[l.r[0]].sec);let v=l.r.reduce((t,r)=>t+(V.R[r]||0),0)*s;if(l.ni)v+=V.NIT;return r2(v);}
function totSec(secs,V){let t=0;for(const l of ESF_FACE)if(l.r&&secs.includes(RUB[l.r[0]].sec))t+=valESF(l,V);return r2(t);}

// Modelo genérico de estado: filas {tipo:'h'|'h2'|'l'|'st'|'gt', t, nota, c, p}
function modeloESF(ctx,notas){
  const filas=[];const V=ctx.cur,P=ctx.cmp;
  for(const l of ESF_FACE){
    if(l.h)filas.push({tipo:'h',t:l.h});
    else if(l.h2)filas.push({tipo:'h2',t:l.h2});
    else if(l.r){const c=valESF(l,V),p=P?valESF(l,P):0;if(Math.abs(c)<0.005&&Math.abs(p)<0.005)continue;filas.push({tipo:'l',t:lineaTit(l),nota:notas[lineaId(l)]||'',c,p});}
    else if(l.st||l.gt){filas.push({tipo:l.gt?'gt':'st',t:l.st||l.gt,c:totSec(l.of,V),p:P?totSec(l.of,P):0});}
  }
  // eliminar encabezados h2 vacíos (sin líneas)
  return filas.filter((f,i)=>!(f.tipo==='h2'&&filas[i+1]&&(filas[i+1].tipo==='st')&&Math.abs(filas[i+1].c)<0.005&&Math.abs(filas[i+1].p)<0.005)&&!(f.tipo==='st'&&/no corriente/.test(f.t)&&Math.abs(f.c)<0.005&&Math.abs(f.p)<0.005));
}
function modeloERI(ctx,notas){
  const V=ctx.eriCur||ctx.cur,P=ctx.eriPrev||null;const filas=[];let rc=0,rp=0;
  const hayORI=Math.abs(V.R.ORI)>0.005||(P&&Math.abs(P.R.ORI)>0.005);
  for(const l of ERI_FACE){
    if(l.oriOnly&&!hayORI)continue;
    if(l.r){const c=r2(-V.R[l.r[0]]),p=P?r2(-P.R[l.r[0]]):0;rc+=c;rp+=p;if(Math.abs(c)<0.005&&Math.abs(p)<0.005)continue;
      // títulos de grupo para que los gastos no aparezcan "sueltos"
      const sec=RUB[l.r[0]].sec,gk=(sec==='OI'||sec==='GO')?'O':sec==='FN'?'F':'';
      if(gk&&!filas.some(f=>f.g===gk)){const hayOI=Math.abs(V.R.OTROS_ING||0)>0.005||(P&&Math.abs(P.R.OTROS_ING||0)>0.005);
        filas.push({tipo:'h2',g:gk,t:gk==='O'?(hayOI?'Otros ingresos y gastos de operación':'Gastos de operación'):'Resultado financiero'});}
      filas.push({tipo:'l',t:lineaTit(l),nota:notas[lineaId(l)]||'',c,p});}
    else filas.push({tipo:l.tot?'gt':'st',t:l.sub,c:r2(rc),p:r2(rp)});
  }
  // modo "movimiento": conciliar con el resultado acumulado del ejercicio que muestra el estado de situación
  if(ctx.eriModo==='mov'&&ctx.base&&(Math.abs(ctx.base.NIT)>0.005||(ctx.prev&&Math.abs(ctx.prev.base.NIT)>0.005))){
    filas.push({tipo:'l',t:`Resultado acumulado del ejercicio al ${fCorta(ctx.baseFecha)}`,c:ctx.base.NIT,p:ctx.prev?ctx.prev.base.NIT:0});
    filas.push({tipo:'gt',t:`Resultado acumulado del ejercicio al ${fCorta(ctx.curFecha)}`,c:ctx.cur.NIT,p:ctx.prev?ctx.prev.cur.NIT:0});}
  // quitar subtotales consecutivos repetidos
  return filas.filter((f,i)=>!(f.tipo==='st'&&(!filas[i-1]||filas[i-1].tipo!=='l'||f.t==='Ganancia (pérdida) bruta'&&!filas.slice(0,i).some(x=>x.tipo==='l'))));
}
// ---------- Estado de cambios en el patrimonio ----------
const ECP_COLS=[{id:'CAPITAL',t:'Capital social',r:['CAPITAL']},{id:'APORTES',t:'Aportes para futuras capitalizaciones',r:['APORTES']},{id:'ACT_PAT',t:'Actualización del patrimonio',r:['ACT_PAT']},
 {id:'RES',t:'Reserva legal',r:['RES_LEGAL']},{id:'OTR',t:'Otras reservas y superávit',r:['OTRAS_RES','SUPERAVIT']},{id:'RA',t:'Resultados acumulados',r:['RA','RES_EJ'],ni:true}];
function ecpVals(V){const o={};ECP_COLS.forEach(c=>{let v=-c.r.reduce((t,r)=>t+(V.R[r]||0),0);if(c.ni)v+=V.NIT;o[c.id]=r2(v);});return o;}
function modeloECP(ctx,lbl){
  const B=ecpVals(ctx.base),F=ecpVals(ctx.cur);let NI=(lbl&&lbl.sinNI)?0:r2(ctx.cur.NIT-ctx.base.NIT);
  // modo acumulado con balance cortado a mitad de ejercicio: el saldo inicial se muestra antes del resultado del ejercicio
  let baseFecha=ctx.baseFecha,acum=false;
  if(!(lbl&&lbl.sinNI)&&ctx.eriModo!=='mov'&&Math.abs(ctx.base.NIT||0)>0.005){acum=true;B.RA=r2(B.RA-ctx.base.NIT);NI=ctx.cur.NIT;baseFecha=ctx.inicioEj?addDays(ctx.inicioEj,-1):baseFecha;}
  // primer ejercicio (sin comparativo): no hay saldo inicial; todo el patrimonio se presenta como movimiento del ejercicio
  const primero=(!!ctx.sinComp||Object.values(B).every(v=>Math.abs(v)<0.005))&&!(lbl&&lbl.sinNI);
  if(primero){Object.keys(B).forEach(k=>B[k]=0);NI=ctx.cur.NIT;acum=false;}
  const cols=ECP_COLS.filter(c=>Math.abs(B[c.id])>0.005||Math.abs(F[c.id])>0.005||c.id==='CAPITAL'||c.id==='RA');
  const d=id=>r2(F[id]-B[id]);
  const resv=r2(d('RES')+(d('OTR')));
  const filas=[
    ...(primero?[]:[{t:acum?`Saldos al inicio del ejercicio${ctx.inicioEj?' ('+fLarga(baseFecha)+')':''}`:`Saldos al ${fLarga(ctx.baseFecha)}`,v:B,tipo:'st'}]),
    {t:(lbl&&lbl.aum)||(primero?'Capital suscrito y aportes de los accionistas':'Aumento de capital y aportes de los accionistas'),v:{CAPITAL:d('CAPITAL'),APORTES:d('APORTES'),ACT_PAT:d('ACT_PAT')}},
    {t:'Apartado para reserva legal y otras reservas',v:{RES:d('RES'),OTR:d('OTR'),RA:-resv}},
    {t:(lbl&&lbl.otros)||(primero?'Resultados acumulados y otros movimientos':'Dividendos decretados y otros movimientos'),v:{RA:r2(d('RA')-NI+resv)}},
    {t:Math.abs(ctx.base.NIT||0)>0.005&&!acum&&!primero?'Resultado integral del período':'Resultado integral del ejercicio',v:{RA:NI}},
    {t:`Saldos al ${fLarga(ctx.curFecha)}`,v:F,tipo:'gt'},
  ].filter(f=>f.tipo||cols.some(c=>Math.abs(f.v[c.id]||0)>0.005));
  filas.forEach(f=>{f.tot=r2(cols.reduce((s,c)=>s+(f.v[c.id]||0),0));});
  return {cols,filas};
}
// ---------- Estado de flujos de efectivo (método indirecto) ----------
function modeloEFE(ctx){
  const C=ctx.cur,B=ctx.base;const dv=id=>r2(-((C.R[id]||0)-(B.R[id]||0))); // efecto en efectivo
  const op=[],inv=[],fin=[];
  const lbl=(id,v)=>{const r=RUB[id];const act=r.sec==='AC'||r.sec==='ANC';
    if(id==='PPE')return v<0?'Adquisición de propiedades, planta y equipos':'Venta o retiro de propiedades, planta y equipos';
    if(id==='INTANG')return v<0?'Adquisición de activos intangibles':'Venta o retiro de activos intangibles';
    if(id==='CAPITAL')return 'Aumento (disminución) de capital social';
    if(id==='APORTES')return 'Aportes para futuras capitalizaciones';
    if(id==='PREST_CP'||id==='PREST_LP')return (v>0?'Préstamos obtenidos':'Pagos de préstamos')+(id==='PREST_LP'?' a largo plazo':' a corto plazo');
    return (act?'(Aumento) disminución en ':'Aumento (disminución) en ')+r.nombre.toLowerCase();};
  let dep=0;
  for(const id of RUB_IDS){const r=RUB[id];if(r.est!=='ESF'||id==='EFE')continue;const v=dv(id);
    if(r.flujo==='DEP'){dep+=v;continue;}
    if(Math.abs(v)<0.005)continue;
    if(r.flujo==='OP')op.push({t:lbl(id,v),v});else if(r.flujo==='INV')inv.push({t:lbl(id,v),v});else if(r.flujo==='FIN')fin.push({t:lbl(id,v),v});
  }
  // resultados: −Δ(RA, reservas, RES_EJ) − NI base
  const raIds=RUB_IDS.filter(id=>RUB[id].flujo==='RA');
  const raFlow=r2(raIds.reduce((s,id)=>s+dv(id),0));
  if(Math.abs(raFlow)>0.005)fin.push({t:'Dividendos pagados y otros movimientos de resultados acumulados',v:raFlow});
  // en modo acumulado el resultado es el del ejercicio; se resta lo ya registrado antes del inicio del balance
  const acum=ctx.eriModo!=='mov'&&Math.abs(B.NIT)>0.005;
  const NI=acum?C.NIT:r2(C.NIT-B.NIT);const ajAnt=acum?r2(-B.NIT):0;
  const ajLbl=ctx.desde?`Resultado del ejercicio registrado antes del ${fCorta(ctx.desde)}`:'Resultado del ejercicio registrado en períodos anteriores';
  const sum=a=>r2(a.reduce((s,x)=>s+x.v,0));
  const tOp=r2(NI+ajAnt+dep+sum(op)),tInv=sum(inv),tFin=sum(fin);
  const neto=r2(tOp+tInv+tFin);const ini=B.R.EFE,fin_=C.R.EFE;
  return {NI,ajAnt,ajLbl,dep,op,inv,fin,tOp,tInv,tFin,neto,ini,fin:fin_,finL:fin,dif:r2(ini+neto-fin_)};
}

// ECP comparativo (dos ejercicios) cuando existe período anterior
function modeloECPComp(ctx){
  const act=modeloECP(ctx);if(!ctx.prev)return act;
  const ant=modeloECP({base:ctx.prev.base,cur:ctx.prev.cur,baseFecha:ctx.prev.baseFecha,curFecha:ctx.prev.curFecha,eriModo:ctx.eriModo,inicioEj:inicioEjercicio(ctx.emp,ctx.prev.per.hasta)});
  const ids=new Set([...act.cols,...ant.cols].map(c=>c.id));const cols=ECP_COLS.filter(c=>ids.has(c.id));
  const filas=[...ant.filas,...(act.filas[0]&&act.filas[0].tipo==='st'?act.filas.slice(1):act.filas)];
  filas.forEach(f=>{f.tot=r2(cols.reduce((s,c)=>s+(f.v[c.id]||0),0));});
  return {cols,filas};
}

/* =================== GENERACIÓN DE DOCUMENTOS =================== */
function rellenar(texto,D){
  return String(texto||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>{const v=D[k];return (v!=null&&String(v).trim()!=='')?esc(v):`<span class="ph">[${k}]</span>`;});
}
// Líneas del saludo ("A la dirección de…", empresa, ciudad) que siguen al título del informe
function lineasSaludo(ls){let i=0;while(i<ls.length&&ls[i].startsWith('# '))i++;const s=i;
  while(i<ls.length&&!ls[i].startsWith('#')&&ls[i].length<100&&(!/\.$/.test(ls[i])||ls[i].length<40))i++;return i>s?[s,i]:null;}
function saludoTexto(texto){const ls=String(texto||'').split('\n').map(l=>l.trim()).filter(Boolean);const s=lineasSaludo(ls);return s?ls.slice(s[0],s[1]).join('\n'):'';}
function negritaEmpresa(html,D){const n=esc(D.EMPRESA||'').trim();if(!n)return html;
  const re=new RegExp('(?<!<b>)'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'),'gi');return html.replace(re,m=>`<b>${m}</b>`);}
function textoAParrafos(texto,D,opt={}){
  const ls=String(texto||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const sal=opt.informe?lineasSaludo(ls):null;
  const html=ls.map((l,i)=>{
    if(sal&&i===sal[0]){const dir=(opt.dirigido||'').split('\n').map(x=>x.trim()).filter(Boolean);const lin=dir.length?dir:ls.slice(sal[0],sal[1]);
      return `<p style="text-align:left">${lin.map(x=>rellenar(x,D)).join('<br>')}</p>`;}
    if(sal&&i>sal[0]&&i<sal[1])return '';
    if(l.startsWith('# '))return `<div class="dt">${rellenar(l.slice(2),D)}</div>`;
    if(l.startsWith('## '))return `<div class="ds">${rellenar(l.slice(3),D)}</div>`;
    const m=l.match(/^([^:]{3,60}):\s(.+)$/);
    if(m&&!/\{\{/.test(m[1])&&/^[A-ZÁÉÍÓÚÑ]/.test(m[1])&&m[1].split(' ').length<=7)return `<p><b>${rellenar(m[1],D)}:</b> ${rellenar(m[2],D)}</p>`;
    return `<p>${rellenar(l,D)}</p>`;
  }).join('');
  return opt.informe?negritaEmpresa(html,D):html;
}
function datosBase(emp,extra){
  return Object.assign({EMPRESA:emp.razon,RIF:emp.rif,CIUDAD:emp.ciudad||DB.settings.ciudad,MONEDA:emp.moneda||'bolívares',ESTADO:emp.estado,
    REGISTRO:[String(emp.registro.oficina||'').replace(/^registro mercantil\s*/i,''),emp.estado?('de la Circunscripción Judicial del Estado '+emp.estado):''].filter(Boolean).join(' ')},extra||{});
}
function monedaEnc(emp){const m=(emp.moneda||'bolívares').trim();return /^bol[ií]vares$/i.test(m)?'bolívares nominales':m;}
function encabezado(emp,titulo,fechaTxt){
  return `<div class="dh"><div class="e">${esc(emp.razon)}</div>${emp.rif?`<div class="rif">RIF: ${esc(emp.rif)}</div>`:''}<div class="ti">${esc(titulo)}</div><div>${esc(fechaTxt)}</div><div class="mo">(Expresado en ${esc(monedaEnc(emp))})</div></div>`;
}
function firmaContador(f,ciudad,fecha,conRazon){
  return `<div class="firma">${conRazon&&DB.settings.firma?`<div><b>${esc(DB.settings.firma)}</b></div>`:''}
  <div class="raya">_________________________________</div>
  <div><b>${esc(f.nombre||'[Nombre del contador]')}</b></div>
  <div>${esc(f.titulo||'Contador Público Colegiado')}</div>
  <div>C.P.C. N.° ${esc(f.cpc||'[CPC]')}</div>

// ---------- Notas ----------
function cuentasDeLinea(ctx,l,eri){
  const {emp,per}=ctx;const cur=eri?(ctx.eriCur||ctx.cur):ctx.cur;const cmp=eri?(ctx.eriPrev||null):ctx.cmp;const usarComp=!!cmp;const out=[];
  const info={};per.cuentas.forEach(a=>info[a.k]=a);
  if(eri&&ctx.prev)ctx.prev.per.cuentas.forEach(a=>{if(!info[a.k])info[a.k]=a;});
  for(const r of l.r){
    const keys=Object.keys(info).filter(k=>{const a=info[k];return rubroDe(emp,a)===r;});
    const rows=keys.map(k=>({a:info[k],c:cur.A[k]||0,p:usarComp?(cmp.A[k]||0):0})).filter(x=>Math.abs(x.c)>0.005||Math.abs(x.p)>0.005)
      .sort((x,y)=>String(x.a.c).localeCompare(String(y.a.c)));
    out.push({r,rows});
  }
  return out;
}
function construirNotas(ctx,o){
  // o: {tipo:'A'|'B'|'C', codigos, eri:true}
  const {emp,per}=ctx;const num={};let n=1;const bloques=[];
  const D=datosBase(emp,{FECHA_CIERRE:fLarga(per.hasta),FECHA_INICIO:fLarga(per.desde)});
  if(o.tipo==='C'){bloques.push({n:n++,t:'Constitución, operaciones, accionistas y dirección',html:notaEntidad(emp,true)});}
  else if(o.tipo==='B'){bloques.push({n:n++,t:'Entidad que informa',html:notaEntidad(emp,false)});}
  (o.pre||[]).forEach(b=>bloques.push({n:n++,...b}));
  if(o.tipo!=='A'){
    if(!o.sinBases)bloques.push({n:n++,t:'Bases de preparación de los estados financieros',html:textoAParrafos(basesDe(emp),D)});
    const pols=politicasDe(emp).filter(p=>!o.soloAplicables||!p.rel||!p.rel.length||p.rel.some(r=>Math.abs(ctx.cur.R[r]||0)>0.005||(ctx.cmp&&Math.abs(ctx.cmp.R[r]||0)>0.005)));
    bloques.push({n:n++,t:'Resumen de las principales políticas contables',html:pols.map((p,i)=>`<div class="ds">${String.fromCharCode(97+i)}) ${esc(p.titulo)}</div><p>${rellenar(p.texto,D).replace(/\n/g,'</p><p>')}</p>`).join('')});
  }
  const lineasESF=ESF_FACE.filter(l=>l.r);const lineasERI=o.eri===false?[]:ERI_FACE.filter(l=>l.r&&!l.oriOnly);
  const sp=(l,eri)=>eri?-1:signoSec(RUB[l.r[0]].sec);
  for(const [l,eri] of [...lineasESF.map(l=>[l,false]),...lineasERI.map(l=>[l,true])]){
    const grupos=cuentasDeLinea(ctx,l,eri);const total=grupos.reduce((s,g)=>s+g.rows.length,0);
    if(!total)continue;
    const id=lineaId(l);num[id]=n;
    const s=sp(l,eri);const conComp=eri?ctx.eriComp:ctx.hayComp;
    const nomb=a=>(o.codigos?esc(a.c)+' – ':'')+esc(a.n);
    let filas='';let tc=0,tp=0;
    grupos.forEach(g=>{if(!g.rows.length)return;
      if(l.r.length>1)filas+=`<tr class="h2"><td colspan="3">${esc(RUB[g.r].nombre)}</td></tr>`;
      let sc=0,spp=0;
      g.rows.forEach(x=>{const c=x.c*s,p=x.p*s;sc+=c;spp+=p;filas+=`<tr class="ind" data-s="${esc(JSON.stringify(conComp?[r2(c),r2(p)]:[r2(c)]))}"><td>${nomb(x.a)}</td><td class="n">${fmtD(c)}</td>${conComp?`<td class="n">${fmtD(p)}</td>`:''}</tr>`;});
      if(l.r.length>1)filas+=`<tr class="st"><td>Subtotal</td><td class="n">${fmtD(sc)}</td>${conComp?`<td class="n">${fmtD(spp)}</td>`:''}</tr>`;
      tc+=sc;tp+=spp;});
    if(o.aj&&Math.abs(o.aj[id]||0)>0.005){tp+=o.aj[id];filas+=`<tr class="ind"><td>${esc(o.ajTxt||'Efecto del ajuste')}</td><td class="n">-</td><td class="n">${fmtD(o.aj[id])}</td></tr>`;}
    if(l.ni){const ni=ctx.cur.NIT,np=ctx.cmp?ctx.cmp.NIT:0;tc+=ni;tp+=np;filas+=`<tr class="ind"><td>Resultado integral del período</td><td class="n">${fmtD(ni)}</td>${conComp?`<td class="n">${fmtD(np)}</td>`:''}</tr>`;}
    filas+=`<tr class="gt"><td>Total</td><td class="n">${fmtD(tc)}</td>${conComp?`<td class="n">${fmtD(tp)}</td>`:''}</tr>`;
    const com=(emp.notasCom||{})[id];
    let extra='';
    if(id==='CAPITAL'&&o.tipo==='C'&&emp.accionistas.length)extra=tablaAccionistas(emp.accionistas,emp.vn);
    if(id==='CAPITAL'&&o.capExtra)extra+=o.capExtra;
    if(id==='PPE_N'&&o.tipo!=='A'&&!o.aj)extra=`<p>La depreciación cargada a resultados durante el período fue de ${fmt(Math.abs(r2((ctx.cur.R.DEP_PPE||0)-(ctx.base.R.DEP_PPE||0))))}.</p>`;
    bloques.push({n,t:lineaTit(l),html:(com?`<p>${esc(com).replace(/\n/g,'</p><p>')}</p>`:'')+`<table class="ef"><thead><tr><th></th><th>${esc(eri?(ctx.eriLbl||ctx.curLbl):ctx.curLbl)}</th>${conComp?`<th>${esc(eri?ctx.eriPrevLbl:ctx.cmpLbl)}</th>`:''}</tr></thead><tbody>${filas}</tbody></table>`+extra});
    n++;
  }
  (o.post||[]).forEach(b=>bloques.push({n:n++,...b}));
  return {num,bloques};
}
function tablaAccionistas(acc,vn,titulo){

  <tr class="gt"><td>Total</td><td></td><td class="n">${fmt(tot,0)}</td><td class="n">100,00%</td>${vn?`<td class="n">${fmt(tot*vn)}</td>`:''}</tr></tbody></table>`;
}
function notaEntidad(emp,completa){

  else h+=' es una sociedad mercantil constituida de acuerdo con las leyes de la República Bolivariana de Venezuela.';

    if(emp.accionistas.length){const tot=emp.accionistas.reduce((s,a)=>s+(+a.acciones||0),0);
      h+=`<p>El capital social suscrito y pagado ${emp.vn?`asciende a ${fmt(tot*emp.vn)}, `:''}está representado por ${fmt(tot,0)} acciones nominativas${emp.vn?` con un valor nominal de ${fmt(emp.vn)} cada una`:''}, distribuidas de la siguiente manera:</p>`+tablaAccionistas(emp.accionistas,emp.vn);}
    if(emp.directiva.length)h+=`<div class="ds">Dirección y administración</div><table class="ef"><thead><tr><th>Nombre</th><th style="text-align:left">C.I.</th><th style="text-align:left">Cargo</th></tr></thead><tbody>${emp.directiva.map(d=>`<tr><td>${esc(d.nombre)}</td><td>${esc(d.doc||'')}</td><td>${esc(d.cargo||'')}</td></tr>`).join('')}</tbody></table>`;
    if((emp.infoAdicional||'').trim())h+=`<p>${esc(emp.infoAdicional).replace(/\n/g,'</p><p>')}</p>`;
  }
  return h;

function generarEEFF(emp,per,cfg){
  const modoERI=cfg.eri==='mov'||(cfg.eri!=='acum'&&emp.emision==='mensual')?'mov':'acum';
  const ctx=contexto(emp,per,cfg.comp,modoERI);
  const notas=cfg.inc.notas?construirNotas(ctx,{tipo:cfg.notas,codigos:cfg.codigos,soloAplicables:cfg.soloAplicables}):{num:{},bloques:[]};
  const f=firmante(cfg.firmante);const pie=cfg.firmasPie?firmasPie(emp,f):'';
  const cols=ctx.hayComp?[ctx.curLbl,ctx.cmpLbl]:[ctx.curLbl];
  const colsERI=ctx.prev?[ctx.eriLbl,ctx.eriPrevLbl]:[ctx.eriLbl];
  const pages=[];const al=ctx.sinComp?`Al ${fLarga(per.hasta)}`:`Al ${fLarga(per.hasta)} y ${fLarga(ctx.cmpFecha)}`;
  const acumEj=modoERI==='acum'&&Math.abs(ctx.base.NIT)>0.005;const dIni=acumEj?ctx.inicioEj:per.desde;
  const periodoERI=ctx.prev?`Por los períodos terminados el ${fLarga(per.hasta)} y el ${fLarga(ctx.prev.per.hasta)}`:`Por el período comprendido entre el ${fLarga(dIni)} y el ${fLarga(per.hasta)}`;
  const periodo=ctx.prev?`Por los períodos comprendidos entre el ${fLarga(per.desde)} y el ${fLarga(per.hasta)}, y entre el ${fLarga(ctx.prev.per.desde)} y el ${fLarga(ctx.prev.per.hasta)}`:`Por el período comprendido entre el ${fLarga(per.desde)} y el ${fLarga(per.hasta)}`;
  const D=datosBase(emp,{FECHA_CIERRE:fLarga(per.hasta),FECHA_INICIO:fLarga(per.desde),DESTINATARIO:cfg.destinatario});
  const esf=modeloESF(ctx,notas.num),eri=modeloERI(ctx,notas.num),ecp=modeloECPComp(ctx),efe=modeloEFE(ctx);
  const efeP=ctx.prev?modeloEFE({cur:ctx.prev.cur,base:ctx.prev.base,eriModo:modoERI,desde:ctx.prev.per.desde}):null;
  const indice=[];
  if(cfg.inc.informe)indice.push('Informe del contador público independiente');
  if(cfg.inc.esf)indice.push('Estado de situación financiera');if(cfg.inc.eri)indice.push('Estado del resultado integral');
  if(cfg.inc.ecp)indice.push('Estado de cambios en el patrimonio');if(cfg.inc.efe)indice.push('Estado de flujos de efectivo');
  if(cfg.inc.notas)indice.push('Notas a los estados financieros');
  if(cfg.inc.portada)pages.push(pagina(`<div class="portada"><div class="e">${esc(emp.razon)}</div>${emp.rif?`<div>RIF: ${esc(emp.rif)}</div>`:''}<div class="t">ESTADOS FINANCIEROS</div><div>${esc(al)}</div>${cfg.inc.informe?'<div style="margin-top:10pt">con el Informe del Contador Público Independiente</div>':''}
    <div class="indice"><b>Contenido</b><ol>${indice.map(i=>`<li>${i}</li>`).join('')}</ol></div></div>`,false,{pie:0}));
  if(cfg.inc.informe)pages.push(pagina(textoAParrafos(plantilla(cfg.plantilla).texto,D,{informe:true,dirigido:cfg.dirigido})+firmaContador(f,cfg.ciudad,cfg.fechaInf,DB.settings.mostrarFirmaRazon),false,{inf:1,pie:0}));
  if(cfg.inc.esf)pages.push(pagina(encabezado(emp,'Estado de situación financiera',al)+tablaEF(esf,cols,cfg.inc.notas)+(cfg.inc.notas?PIE_NOTAS:'')+pie));
  if(cfg.inc.eri)pages.push(pagina(encabezado(emp,'Estado del resultado integral',periodoERI)+tablaEF(eri,colsERI,cfg.inc.notas)+(cfg.inc.notas?PIE_NOTAS:'')+pie));
  if(cfg.inc.ecp)pages.push(pagina(encabezado(emp,'Estado de cambios en el patrimonio',periodoERI)+tablaECP(ecp)+(cfg.inc.notas?PIE_NOTAS:'')+pie));
  if(cfg.inc.efe)pages.push(pagina(encabezado(emp,'Estado de flujos de efectivo',periodo)+tablaEFE(efe,ctx,efeP)+(cfg.inc.notas?PIE_NOTAS:'')+pie));
  if(cfg.inc.notas&&notas.bloques.length)pages.push(pagina(htmlNotas(emp,notas,'Notas a los estados financieros',al)));
  // validaciones
  const avisos=[];
  const TA=totSec(['AC','ANC'],ctx.cur),TPP=totSec(['PC','PNC','PAT'],ctx.cur);
  if(Math.abs(TA-TPP)>1)avisos.push(`El estado de situación no cuadra: Activo ${fmt(TA)} vs Pasivo + Patrimonio ${fmt(TPP)} (diferencia ${fmt(TA-TPP)}). Revise cuentas sin clasificar o excluidas.`);
  if(Math.abs(ctx.cur.R.SIN)>0.005)avisos.push(`Hay cuentas sin clasificar con saldo ${fmt(ctx.cur.R.SIN)}. Asígnelas en "Clasificación de cuentas".`);
  if(Math.abs(ctx.cur.R.EXCL)>0.005)avisos.push(`Hay cuentas excluidas con saldo neto ${fmt(ctx.cur.R.EXCL)}.`);
  if(!ctx.prev&&!ctx.sinComp)avisos.push('FALTA_ANTERIOR');
  if(Math.abs(ctx.base.NIT)>0.005)avisos.push(`El balance trae saldos iniciales en las cuentas de resultado (el sistema acumula el ejercicio sin cerrar): resultado acumulado al ${fCorta(ctx.baseFecha)} de ${fmt(ctx.base.NIT)}. ${modoERI==='acum'?'El estado de resultados se presenta acumulado del ejercicio (saldo final), igual al resultado del estado de situación.':'El estado de resultados muestra solo el movimiento del período y al final concilia con el resultado acumulado del ejercicio.'} Puede cambiarlo en "Resultados a presentar".`);
  if(ctx.prev){const B=ctx.base,P=ctx.prev.cur;if(ctx.prev.per.hasta===ctx.cmpFecha){const pl=V=>RUB_IDS.filter(id=>RUB[id].est==='ERI').reduce((t,id)=>t+(V.R[id]||0),0);const d=RUB_IDS.filter(id=>RUB[id].est==='ESF'&&!['RA','RES_EJ'].includes(id)&&Math.abs((B.R[id]||0)-(P.R[id]||0))>1);if(Math.abs((B.R.RA+B.R.RES_EJ+pl(B))-(P.R.RA+P.R.RES_EJ+pl(P)))>1)d.push('RA');if(d.length)avisos.push('Los saldos iniciales del balance no coinciden con los saldos finales del período anterior guardado en: '+d.map(id=>RUB[id].nombre).join(', ')+'.');}}
  if(efeP&&Math.abs(efeP.dif)>1)avisos.push(`El flujo de efectivo del período anterior presenta una diferencia de ${fmt(efeP.dif)}.`);
  if(cfg.inc.efe&&Math.abs(efe.dif)>1)avisos.push(`El flujo de efectivo presenta una diferencia de ${fmt(efe.dif)} contra el efectivo final.`);
  return {pages,avisos,ctx,esf,eri,ecp,efe,efeP,notas,cols,colsERI,al,periodo};
}
function tablaECP(ecp){
  const th=`<tr><th style="text-align:left"></th>${ecp.cols.map(c=>`<th>${esc(c.t)}</th>`).join('')}<th>Total patrimonio</th></tr>`;
  const tr=ecp.filas.map(f=>`<tr class="${f.tipo||'ind'}"><td>${esc(f.t)}</td>${ecp.cols.map(c=>`<td class="n">${fmtD(f.v[c.id]||0)}</td>`).join('')}<td class="n">${fmtD(f.tot)}</td></tr>`).join('');
  return `<table class="ef ecp"><thead>${th}</thead><tbody>${tr}</tbody></table>`;
}
function tablaEFE(e,ctx,p){
  const two=!!p;const hdr=two?`<th>${esc(ctx.eriLbl)}</th><th>${esc(ctx.eriPrevLbl)}</th>`:`<th>${esc(ctx.eriLbl||ctx.curLbl)}</th>`;
  const L=(t,v,vp,c='ind')=>`<tr class="${c}"${/ind/.test(c)?` data-s="${esc(JSON.stringify(two?[r2(v),r2(vp||0)]:[r2(v)]))}"`:''}><td>${esc(t)}</td><td class="n">${fmtD(v)}</td>${two?`<td class="n">${fmtD(vp||0)}</td>`:''}</tr>`;
  const H=(t,c='h')=>`<tr class="${c}"><td colspan="${two?3:2}">${esc(t)}</td></tr>`;
  const lista=(a,b,c='ind')=>{const ts=[...new Set([...a.map(x=>x.t),...(b||[]).map(x=>x.t)])];if(!ts.length)return L('Sin movimientos',0,0,c);
    return ts.map(t=>L(t,(a.find(x=>x.t===t)||{}).v||0,b?((b.find(x=>x.t===t)||{}).v||0):0,c)).join('');};
  let h=`<table class="ef"><thead><tr><th></th>${hdr}</tr></thead><tbody>`;
  h+=H('Actividades de operación')+L(Math.abs(ctx.cur.ORI)>0.005?'Resultado integral del ejercicio':'Resultado neto del ejercicio',e.NI,p&&p.NI);
  const hayAj=Math.abs(e.dep)>0.005||(p&&Math.abs(p.dep)>0.005)||Math.abs(e.ajAnt||0)>0.005||(p&&Math.abs(p.ajAnt||0)>0.005);
  if(hayAj)h+=H('Ajustes para conciliar el resultado con el efectivo de las operaciones:','h2');
  if(Math.abs(e.ajAnt||0)>0.005||(p&&Math.abs(p.ajAnt||0)>0.005))h+=L(e.ajLbl,e.ajAnt||0,p&&p.ajAnt,'ind2');
  if(Math.abs(e.dep)>0.005||(p&&Math.abs(p.dep)>0.005))h+=L('Depreciación y amortización',e.dep,p&&p.dep,'ind2');
  if(e.op.length||(p&&p.op.length))h+=H('Cambios en activos y pasivos operacionales:','h2')+lista(e.op,p&&p.op,'ind2');
  h+=L('Efectivo neto provisto por (usado en) actividades de operación',e.tOp,p&&p.tOp,'st');
  h+=H('Actividades de inversión')+lista(e.inv,p&&p.inv);
  h+=L('Efectivo neto provisto por (usado en) actividades de inversión',e.tInv,p&&p.tInv,'st');
  h+=H('Actividades de financiamiento')+lista(e.finL,p&&p.finL);
  h+=L('Efectivo neto provisto por (usado en) actividades de financiamiento',e.tFin,p&&p.tFin,'st');
  h+=L('Aumento (disminución) neto del efectivo y equivalentes',e.neto,p&&p.neto,'st');
  h+=L('Efectivo y equivalentes al inicio del período',e.ini,p&&p.ini);
  h+=L('Efectivo y equivalentes al final del período',e.fin,p&&p.fin,'gt');
  return h+'</tbody></table>';
}

function editorPoliticas(el,lista,onCh){

      <div class="f sm" style="flex:0 0 auto"><button class="btn sec sm" data-pu="${i}">↑</button></div><div class="f sm" style="flex:0 0 auto"><button class="btn bad sm" data-px="${i}">Eliminar</button></div></div>
      <textarea data-pp="${i}" style="margin-top:6px">${esc(p.texto)}</textarea>
      <div class="hint">Se incluye solo si hay saldo en: ${(p.rel||[]).map(r=>RUB[r]?RUB[r].nombre:r).join(', ')||'siempre'}</div></div>`).join('')+`<button class="btn sec sm" id="pAdd">+ Agregar política</button>`;
    $$('[data-pt]',el).forEach(i=>i.onchange=()=>{lista[+i.dataset.pt].titulo=i.value;onCh();});
    $$('[data-pp]',el).forEach(i=>i.onchange=()=>{lista[+i.dataset.pp].texto=i.value;onCh();});
    $$('[data-px]',el).forEach(b=>b.onclick=()=>{lista.splice(+b.dataset.px,1);onCh();draw();});
    $$('[data-pu]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.pu;if(i>0){[lista[i-1],lista[i]]=[lista[i],lista[i-1]];onCh();draw();}});
    $('#pAdd',el).onclick=()=>{lista.push({id:uid(),titulo:'Nueva política',texto:'',rel:[]});onCh();draw();};
  };draw();
}

    if(MAPF.sec&&r!==MAPF.sec)return false;return true;});};

  };
  const resumen=()=>{const W=valores(e,p,'sf'),I=valores(e,p,'si');
    $('#mRes').innerHTML=`<table class="t"><thead><tr><th>Rubro</th><th>Estado</th><th class="n">Saldo inicial</th><th class="n">Saldo final</th></tr></thead><tbody>${RUB_IDS.filter(id=>Math.abs(W.R[id])>0.005||Math.abs(I.R[id])>0.005).map(id=>`<tr><td><a href="#" data-fr="${id}">${esc(RUB[id].nombre)}</a></td><td>${RUB[id].est}</td><td class="n">${fmt(I.R[id])}</td><td class="n">${fmt(W.R[id])}</td></tr>`).join('')}</tbody></table>`;
    $$('[data-fr]').forEach(a=>a.onclick=ev=>{ev.preventDefault();MAPF.sec=a.dataset.fr;VISTAS.mapeo();});};
  tabla();resumen();
  $('#mQ').oninput=ev=>{MAPF.q=ev.target.value;tabla();};
  $('#mSolo').onchange=ev=>{MAPF.solo=ev.target.value;tabla();};
  $('#mSec').onchange=ev=>{MAPF.sec=ev.target.value;tabla();};
  $('#mConf').onclick=()=>{filtradas().forEach(a=>{e.mapa[a.k]={r:rubroDe(e,a),a:0};});guardar();VISTAS.mapeo();toast('Clasificación confirmada');};
  $('#mReauto').onclick=()=>{p.cuentas.forEach(a=>{if(!e.mapa[a.k]||e.mapa[a.k].a)e.mapa[a.k]={r:autoRubro(a),a:1};});guardar();VISTAS.mapeo();};
  $('#mBulk').onchange=ev=>{const v=ev.target.value;if(!v)return;const L=filtradas();if(!confirm(`¿Asignar ${L.length} cuentas a "${RUB[v].nombre}"?`)){ev.target.value='';return;}L.forEach(a=>e.mapa[a.k]={r:v,a:0});guardar();VISTAS.mapeo();};
};

function cfgEEFF(e,p){
  e.cfgEEFF=e.cfgEEFF||{};const c=e.cfgEEFF;
  return Object.assign({comp:'auto',notas:'B',plantilla:e.plantilla||'eeff_4410',firmante:DB.settings.firmantes[0]?.id,fechaInf:hoy(),ciudad:e.ciudad||DB.settings.ciudad,

}

  const sync=()=>{if(c.plantilla!==$('#cPlant').value){c.dirigido='';$('#cDir').value=saludoTexto(plantilla($('#cPlant').value).texto).replace(/\{\{EMPRESA\}\}/g,e.razon).replace(/\{\{CIUDAD\}\}/g,$('#cCiudad').value||e.ciudad||DB.settings.ciudad);}

const FUENTES=[['Arial','Arial, Helvetica, sans-serif'],['Calibri','Calibri, Carlito, "Segoe UI", sans-serif'],['Cambria','Cambria, Caladea, Georgia, serif'],
 ['Times New Roman','"Times New Roman", Times, serif'],['Georgia','Georgia, serif'],['Book Antiqua','"Book Antiqua", "Palatino Linotype", Palatino, serif'],
 ['Garamond','Garamond, "EB Garamond", "Times New Roman", serif'],['Tahoma','Tahoma, Verdana, sans-serif'],['Verdana','Verdana, sans-serif'],['Century Gothic','"Century Gothic", "URW Gothic", Futura, sans-serif']];

function textoHoja(o,num){const n=String(num||'').trim();return o.notaPie.replace('{{HOJA}}',`${o.hojaPref?o.hojaPref+' ':''}${n||'______________'}`);}
function sigOpc(o,hoja){return JSON.stringify([o.fuente,o.tam,o.logo,o.color,o.hojaPref,o.pie,o.notaPie,hoja||'',!!o.logoData]);}

// Convierte páginas lógicas en hojas A4 reales con encabezado, pie, número de página y cortes Van/Vienen
function paginar(pagesHtml,M){
  const o=impDef();const fam=(FUENTES.find(f=>f[0]===o.fuente)||FUENTES[0])[1];
  const logo=o.logoData||LOGO_CONTALFA;const hojaTxt=textoHoja(o,M.hoja);
  const meas=document.createElement('div');meas.className='doc';
  meas.style.cssText=`position:absolute;left:-30000px;top:0;visibility:hidden;font-family:${fam};font-size:${o.tam}pt`;
  document.body.appendChild(meas);
  const src=document.createElement('div');src.innerHTML=pagesHtml.join('');
  const out=[];
  for(const lp of [...src.children]){
    const land=lp.classList.contains('land'),pie=lp.dataset.pie==='1',inf=lp.dataset.inf==='1';
    const conLogo=o.logo==='todas'||(o.logo==='informe'&&inf);
    const dh=[...lp.children].find(x=>x.classList.contains('dh'));
    let cur=null;
    const nueva=cont=>{
      const pg=document.createElement('div');pg.className='page fis'+(land?' land':'');
      pg.style.cssText=`font-family:${fam};font-size:${o.tam}pt;--doc-c:${o.color}`;
      pg.innerHTML=`<div class="rh">${conLogo?`<img src="${logo}" alt="Logo">`:''}<div class="rhe">${inf?'':`<div class="n">${esc(M.emp.razon)}</div>${M.emp.rif?`<div class="r">RIF: ${esc(M.emp.rif)}</div>`:''}`}</div><div class="rhd"><div class="t">${esc(M.doc)}</div>${M.sub?`<div class="s">${esc(M.sub)}</div>`:''}</div></div><div class="pb"></div><div class="pf"><span class="hs">${pie&&o.pie&&M.conHoja!==false?esc(hojaTxt):''}</span><span class="pn"></span></div>`;
      meas.appendChild(pg);out.push(pg);cur=pg.querySelector('.pb');
      if(cont&&dh){const c=dh.cloneNode(true);const ti=c.querySelector('.ti');if(ti)ti.textContent+=' (continuación)';cur.appendChild(c);}
    };
    const lleno=()=>cur.scrollHeight>cur.clientHeight+1;
    const soloTitulo=()=>!cur.children.length||(cur.children.length===1&&cur.firstElementChild.classList.contains('dh'));
    const esTitulo=el=>el&&['nota-t','ds','dt'].some(c=>el.classList.contains(c));
    const partirTabla=t=>{
      const filas=[...t.tBodies[0].rows];let sums=null,tmpl=null;
      const shell=()=>{const n=t.cloneNode(false);if(t.tHead)n.appendChild(t.tHead.cloneNode(true));const tb=document.createElement('tbody');n.appendChild(tb);cur.appendChild(n);return tb;};
      const acum=r=>{
        if(/(^| )h( |$)/.test(r.className)){r._prev=sums?clone(sums):null;sums=null;return;}
        if(r.dataset.s){const a=JSON.parse(r.dataset.s);tmpl=r;if(!sums)sums=a.map(v=>v==null?null:0);a.forEach((v,i)=>{if(v!=null)sums[i]=r2((sums[i]||0)+v);});}
      };
      const filaVan=(tipo,s)=>{const tr=document.createElement('tr');tr.className=tipo;let k=0;
        [...tmpl.cells].forEach((c,i)=>{const td=document.createElement('td');if(c.colSpan>1)td.colSpan=c.colSpan;
          if(i===0)td.textContent=tipo==='van'?'Van…':'Vienen…';else if(c.classList.contains('n')){td.className='n';const v=s[k++];td.textContent=v==null?'':fmtD(v);}
          tr.appendChild(td);});return tr;};
      let tb=shell();
      for(const r of filas){
        tb.appendChild(r);
        let probe=null;if(tmpl||r.dataset.s){probe=r.cloneNode(true);probe.className='van';probe.removeAttribute('data-s');tb.appendChild(probe);}
        const over=lleno();if(probe)tb.removeChild(probe);
        if(!over){acum(r);continue;}
        tb.removeChild(r);
        const mov=[];
        while(tb.lastElementChild&&/(^| )(h|h2)( |$)/.test(tb.lastElementChild.className)){const x=tb.lastElementChild;tb.removeChild(x);mov.unshift(x);if(x._prev!==undefined)sums=x._prev;}
        if(!tb.rows.length){tb.parentNode.remove();const mv=[];while(esTitulo(cur.lastElementChild)&&cur.children.length>1){const x=cur.lastElementChild;cur.removeChild(x);mv.unshift(x);}
          if(!soloTitulo()||mv.length)nueva(true);mv.forEach(m=>cur.appendChild(m));tb=shell();mov.forEach(m=>{tb.appendChild(m);acum(m);});tb.appendChild(r);acum(r);continue;}
        const s0=(tmpl&&sums&&sums.some(v=>v))?clone(sums):null;
        if(s0)tb.appendChild(filaVan('van',s0));
        nueva(true);tb=shell();
        if(s0)tb.appendChild(filaVan('vienen',s0));
        mov.forEach(m=>{tb.appendChild(m);acum(m);});
        tb.appendChild(r);acum(r);
      }
    };
    nueva(false);
    const bloques=[...lp.childNodes].filter(n=>n.nodeType===1||(n.nodeType===3&&n.textContent.trim())).map(n=>n.nodeType===3?Object.assign(document.createElement('p'),{textContent:n.textContent.trim()}):n);
    for(const b of bloques){
      cur.appendChild(b);
      if(!lleno())continue;
      cur.removeChild(b);
      const esTabla=b.tagName==='TABLE'&&b.tBodies[0]&&b.tBodies[0].rows.length>1;
      // una tabla larga se parte en esta misma hoja si ya tiene contenido útil
      if(esTabla){partirTabla(b);continue;}
      const mov=[];while(esTitulo(cur.lastElementChild)&&cur.children.length>1){const x=cur.lastElementChild;cur.removeChild(x);mov.unshift(x);}
      if(!soloTitulo()||mov.length)nueva(true);
      mov.forEach(m=>cur.appendChild(m));
      cur.appendChild(b);
      if(lleno()&&esTabla){cur.removeChild(b);partirTabla(b);}
    }
  }
  out.forEach((pg,i)=>{pg.querySelector('.pn').textContent=`Página ${i+1} de ${out.length}`;});
  const html=out.map(p=>p.outerHTML).join('');meas.remove();return html;
}

/* =================== COMPARATIVO MANUAL (PRIMER PERÍODO) =================== */
const ERI_ACREEDOR=['ING_ORD','OTROS_ING','ING_FIN','DIF_CAMB','REME','ORI'];
const sgnESF=id=>['DEP_PPE','AMORT_INT'].includes(id)?-1:signoSec(RUB[id].sec);
function capturaManual(e,p,onDone){
  const fa=fechasPeriodoAnterior(e,p);const SI=valores(e,p,'si');
  const plSI=RUB_IDS.filter(id=>RUB[id].est==='ERI').reduce((s,id)=>s+SI.R[id],0);const cerrado=Math.abs(plSI)<1;
  const previo=e.periodos.find(x=>x.manual&&x.desde===fa.desde&&x.hasta===fa.hasta);
  const val={};if(previo)previo.cuentas.forEach(a=>{const id=a.k.slice(4);if(RUB[id].est==='ESF')val['o_'+id]=r2(a.si*sgnESF(id));else val['r_'+id]=r2((a.sf-a.si)*(ERI_ACREEDOR.includes(id)?-1:1));});
  const esf=RUB_IDS.filter(id=>RUB[id].est==='ESF'),eri=RUB_IDS.filter(id=>RUB[id].est==='ERI');
  const inp=k=>`<input type="number" step="any" data-k="${k}" value="${val[k]??''}" style="text-align:right">`;
  modal(`<h2 style="margin-top:0">Cifras comparativas del período anterior</h2>
  <p class="hint">Para el primer período que se emite con esta herramienta (o si no tiene el balance anterior), escriba las cifras del período ${fCorta(fa.desde)} al ${fCorta(fa.hasta)} tomándolas de los estados financieros ya emitidos. El saldo al cierre de ese período se toma automáticamente del saldo inicial del balance actual. Escriba todos los montos en positivo (las depreciaciones acumuladas y los gastos también); use negativo solo para déficit o pérdidas en cambio.</p>
  <div class="tabs" id="mTabs"><button class="on" data-t="eri">Estado de resultados</button><button data-t="esf">Situación financiera al inicio (${fCorta(addDays(fa.desde,-1))})</button></div>
  <div data-m="eri"><table class="t">${eri.map(id=>`<tr><td>${esc(RUB[id].nombre)}${['DIF_CAMB','REME'].includes(id)?' <span class="hint">(+ ganancia / − pérdida)</span>':''}</td><td style="width:180px">${inp('r_'+id)}</td></tr>`).join('')}<tr><td><b>Resultado del período</b></td><td class="n"><b id="mNI"></b></td></tr></table></div>
  <div data-m="esf" style="display:none"><div class="btns" style="margin:0 0 8px"><button class="btn sec sm" id="mCopia">Copiar los saldos al cierre como punto de partida</button></div>
   <div class="scroll" style="max-height:48vh"><table class="t"><thead><tr><th>Rubro</th><th class="n">Al inicio ${fCorta(addDays(fa.desde,-1))}</th><th class="n">Al cierre ${fCorta(fa.hasta)}</th></tr></thead><tbody>
   ${esf.map(id=>`<tr><td>${esc(RUB[id].nombre)}</td><td style="width:170px">${inp('o_'+id)}</td><td class="n">${fmt(SI.R[id]*sgnESF(id))}</td></tr>`).join('')}</tbody></table></div></div>
  <div id="mChk" style="margin-top:8px"></div>
  <div class="btns"><button class="btn" id="mSave">Guardar período comparativo</button><button class="btn sec" id="mCan">Cancelar</button></div>`);
  $$('#mTabs button').forEach(b=>b.onclick=()=>{$$('#mTabs button').forEach(x=>x.classList.toggle('on',x===b));$$('[data-m]').forEach(d=>d.style.display=d.dataset.m===b.dataset.t?'':'none');});
  const leer=()=>{const v={};$$('#mbody [data-k]').forEach(i=>{v[i.dataset.k]=parseFloat(i.value)||0;});return v;};
  const construir=()=>{const v=leer();const ctas=[];
    const plEnt=eri.reduce((s,id)=>s+(v['r_'+id]||0)*(ERI_ACREEDOR.includes(id)?-1:1),0);
    esf.forEach(id=>{let sf=SI.R[id];if(cerrado&&id==='RA')sf=r2(sf-plEnt);const si=r2((v['o_'+id]||0)*sgnESF(id));if(Math.abs(si)>0.004||Math.abs(sf)>0.004)ctas.push({id,si,sf});});
    eri.forEach(id=>{const mv=r2((v['r_'+id]||0)*(ERI_ACREEDOR.includes(id)?-1:1));let si,sf;if(cerrado){si=0;sf=mv;}else{sf=SI.R[id];si=r2(sf-mv);}if(Math.abs(si)>0.004||Math.abs(sf)>0.004)ctas.push({id,si,sf});});
    return {ctas,dif:r2(ctas.reduce((s,a)=>s+a.si,0)),ni:r2(-plEnt)};};
  const chk=()=>{const c=construir();$('#mNI').textContent=fmt(c.ni);
    $('#mChk').innerHTML=Math.abs(c.dif)<1?'<div class="msg ok">Las cifras cuadran: activo = pasivo + patrimonio al inicio del período anterior.</div>':`<div class="msg warn">Diferencia en el estado de situación al inicio: ${fmt(c.dif)}. Revise los saldos iniciales${cerrado?'':' y los resultados'}.</div>`;};
  $$('#mbody [data-k]').forEach(i=>i.oninput=chk);chk();
  $('#mCopia').onclick=()=>{esf.forEach(id=>{const i=$(`#mbody [data-k="o_${id}"]`);const v=r2(SI.R[id]*sgnESF(id));i.value=Math.abs(v)>0.004?v:'';});chk();};
  $('#mCan').onclick=cerrarModal;
  $('#mSave').onclick=()=>{const c=construir();if(Math.abs(c.dif)>=1&&!confirm('Las cifras no cuadran. ¿Guardar de todas formas?'))return;
    const per={id:previo?previo.id:uid(),manual:true,nombre:nombrePeriodo(fa.desde,fa.hasta)+' (captura manual)',desde:fa.desde,hasta:fa.hasta,origen:'Captura manual de cifras comparativas',creado:hoy(),
      cuentas:c.ctas.map(a=>({k:'MAN|'+a.id,c:'',n:RUB[a.id].nombre,g:'Captura manual',cl:'',pz:'',si:a.si,d:0,h:0,sf:a.sf}))};
    per.cuentas.forEach(a=>{e.mapa[a.k]={r:a.k.slice(4),a:0};});
    e.periodos=e.periodos.filter(x=>x.id!==per.id);e.periodos.push(per);e.periodos.sort((a,b)=>(a.hasta||'').localeCompare(b.hasta||''));
    guardar();cerrarModal();refrescarSelects();toast('Período comparativo guardado');onDone&&onDone();};
}

const MODS={APORTES:{t:'capitalización de aportes para futuras capitalizaciones',dr:'APORTES'},UTILIDADES:{t:'capitalización de resultados acumulados',dr:'RA'},
  EFECTIVO:{t:'aporte en efectivo',dr:'EFE'},BIENES:{t:'aporte de bienes',dr:'PPE'},ACREENCIAS:{t:'capitalización de acreencias de accionistas',dr:'CXP_REL'},

function htmlInventario(e,items,titulo,fecha){

  let h=encabezado(e,titulo,fecha)+`<table class="ef sm"><thead><tr><th>Descripción del bien</th><th style="text-align:left">Categoría</th><th style="text-align:left">Marca / modelo / serial</th><th style="text-align:left">Documento de propiedad</th><th>Cant.</th><th>Valor unitario</th><th>Valor total</th></tr></thead><tbody>`;
  let tg=0;
  Object.entries(grupos).forEach(([ap,bs])=>{h+=`<tr class="h2"><td colspan="7">Aportado por: ${esc(ap)}</td></tr>`;let t=0;
    bs.forEach(b=>{const v=(+b.cantidad||1)*(+b.valor||0);t+=v;h+=`<tr class="ind" data-s="${esc(JSON.stringify([null,null,r2(v)]))}"><td>${esc(b.descripcion)}</td><td>${esc(b.categoria)}</td><td>${esc(b.detalle||'')}</td><td>${esc(b.documento||'')}</td><td class="n">${fmt(+b.cantidad||1,0)}</td><td class="n">${fmt(+b.valor||0)}</td><td class="n">${fmt(v)}</td></tr>`;});
    h+=`<tr class="st"><td colspan="6">Subtotal ${esc(ap)}</td><td class="n">${fmt(t)}</td></tr>`;tg+=t;});
  return h+`<tr class="gt"><td colspan="6">TOTAL BIENES</td><td class="n">${fmt(tg)}</td></tr></tbody></table>`;
}
